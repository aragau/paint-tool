<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塗料配合計算</title>

<style>
*{box-sizing:border-box;}

html{
 scroll-behavior:smooth;
}

body{
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 margin:0;
 padding:12px 12px 88px;
 font-size:18px;
 min-height:100vh;
 background:
  radial-gradient(140px 95px at 10% 12%, rgba(255,72,72,0.16) 0%, rgba(255,72,72,0.11) 18%, rgba(255,72,72,0.00) 62%),
  radial-gradient(160px 120px at 88% 16%, rgba(255,159,28,0.14) 0%, rgba(255,159,28,0.09) 18%, rgba(255,159,28,0.00) 65%),
  radial-gradient(170px 130px at 18% 42%, rgba(255,235,59,0.13) 0%, rgba(255,235,59,0.08) 18%, rgba(255,235,59,0.00) 66%),
  radial-gradient(180px 140px at 82% 40%, rgba(76,175,80,0.12) 0%, rgba(76,175,80,0.08) 18%, rgba(76,175,80,0.00) 66%),
  radial-gradient(170px 130px at 38% 76%, rgba(0,188,212,0.13) 0%, rgba(0,188,212,0.08) 18%, rgba(0,188,212,0.00) 66%),
  radial-gradient(160px 120px at 92% 78%, rgba(63,81,181,0.12) 0%, rgba(63,81,181,0.08) 18%, rgba(63,81,181,0.00) 66%),
  radial-gradient(140px 100px at 58% 22%, rgba(156,39,176,0.10) 0%, rgba(156,39,176,0.06) 18%, rgba(156,39,176,0.00) 68%),
  radial-gradient(150px 110px at 68% 66%, rgba(255,105,180,0.10) 0%, rgba(255,105,180,0.06) 18%, rgba(255,105,180,0.00) 68%),
  linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.94));
 background-attachment: fixed;
}

h1{
 text-align:center;
 font-size:26px;
 margin: 8px 0 10px;
}

.header{
 background:#2d6cdf;
 color:white;
 font-size:22px;
 font-weight:bold;
 display:grid;
 grid-template-columns:48px 1fr 48px;
 align-items:center;
 padding:14px;
 border-radius:10px;
}
.header::before{content:"";}
.header-title{text-align:center;}

.weather-alert{
 background:#fff1f0;
 border:1px solid #eea9a2;
 color:#b42318;
 margin-top:12px;
 padding:11px 12px;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 line-height:1.45;
}

.box{
 background:#eaf3ff;
 margin-top:12px;
 padding:12px;
 border-radius:10px;
}

.alert{
 background:#fff3e0;
 border:2px solid #ff9800;
}

.info{
 background:#e8f5e9;
 border:2px solid #4caf50;
 font-size:16px;
}

.history-inline{
 display:flex;
 flex-direction:column;
 gap:10px;
 margin-top:12px;
 padding:10px 12px;
}

.history-inline-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.history-inline-label{
 flex:1 1 auto;
 min-width:0;
 font-weight:bold;
 font-size:15px;
 color:#1f2937;
 white-space:nowrap;
}

.history-inline-value{
 font-size:14px;
 line-height:1.45;
 color:#111827;
 word-break:break-word;
}

label{
 display:block;
 font-weight:bold;
 font-size:20px;
}

.note{
 color:#cc6600;
 font-size:15px;
 line-height:1.4;
}

select,input,button{
 width:100%;
 margin-top:8px;
 padding:14px;
 font-size:22px;
 border-radius:8px;
}

button{
 background:#2d6cdf;
 color:white;
 border:none;
 font-weight:bold;
 cursor:pointer;
}

button:active{
 transform: translateY(1px);
}

.btn-sub{
 background:#ff9800;
 font-size:18px;
 margin-top:12px;
 padding:10px;
}

.btn-gray{
 background:#6b7280;
 font-size:18px;
}

.result{
 background:#f5f5f5;
 margin-top:18px;
 padding:15px;
 border-radius:10px;
 min-height:30px;
}

.step{
 text-align:center;
 margin-bottom:18px;
}

.value{
 color:#d96c2f;
 font-size:36px;
 font-weight:bold;
}

#actualBox {
 display: none;
}
.thin-note{
 margin-top:8px;
 font-size:15px;
 font-weight:bold;
}

.voice-start{
 grid-column:3;
 width:48px;
 height:48px;
 margin:0;
 padding:0;
 background:transparent;
 color:white;
 font-size:27px;
 line-height:1;
}
.voice-inline-status{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#eef5ff;color:#1f3c70;font-size:16px;font-weight:bold;text-align:center;}
.voice-inline-status.open{display:block;}
.voice-inline-heard{margin-top:5px;color:#52606f;font-size:15px;font-weight:normal;word-break:break-word;}
.voice-inline-active{outline:3px solid #2d6cdf;box-shadow:0 0 0 5px rgba(45,108,223,.15);}
.voice-overlay.open{display:flex;}
.voice-overlay{
 position:fixed;
 inset:0;
 z-index:1000;
 display:none;
 align-items:center;
 justify-content:center;
 padding:16px;
 background:rgba(15,23,42,.52);
}
.voice-panel{
 width:min(100%,520px);
 background:
  radial-gradient(150px 120px at 12% 8%, rgba(255,159,28,.14), transparent 65%),
  radial-gradient(170px 130px at 88% 88%, rgba(76,175,80,.12), transparent 65%),
  linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,251,255,.97));
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 18px 55px rgba(15,23,42,.35);
}
.voice-panel-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 padding:14px 16px;
 background:#2d6cdf;
 color:white;
 font-size:21px;
 font-weight:bold;
}
.voice-close{
 width:auto;
 margin:0;
 padding:8px 12px;
 background:#6b7280;
 font-size:15px;
}
.voice-body{padding:16px 14px 14px;}
.voice-guide{text-align:center;color:#4b5563;font-size:15px;margin:0 0 12px;}
.voice-list{display:flex;flex-direction:column;gap:10px;}
.voice-item{padding:12px;border:2px solid #bed4ee;border-radius:12px;background:#eaf3ff;}
.voice-item.active{border-color:#2d6cdf;background:#f7fbff;box-shadow:0 0 0 3px rgba(45,108,223,.12);}
.voice-item.done{border-color:#4caf50;background:#e8f5e9;}
.voice-item.error{border-color:#d97706;background:#fff7ed;box-shadow:0 0 0 3px rgba(217,119,6,.12);}
.voice-item-top{display:flex;justify-content:space-between;gap:10px;align-items:center;}
.voice-item-label{font-size:18px;font-weight:bold;color:#1f2937;}
.voice-item-state{font-size:14px;color:#4b5563;font-weight:bold;white-space:nowrap;}
.voice-listening-dots{display:inline-flex;gap:3px;margin-left:5px;vertical-align:middle;}
.voice-listening-dots i{display:block;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25;animation:voice-dot-pulse 1.05s infinite ease-in-out;}
.voice-listening-dots i:nth-child(2){animation-delay:.16s;}
.voice-listening-dots i:nth-child(3){animation-delay:.32s;}
@keyframes voice-dot-pulse{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.voice-item.active .voice-item-state{color:#1d4ed8;}
.voice-item.done .voice-item-state{color:#15803d;}
.voice-item.error .voice-item-state{color:#b45309;}
.voice-item-value{min-height:34px;margin-top:6px;color:#52606f;font-size:21px;font-weight:bold;line-height:1.3;}
.voice-item.active .voice-item-value{color:#1f3c70;}
.voice-item.done .voice-item-value{color:#166534;font-size:27px;}
.voice-item.error .voice-item-value{color:#9a3412;}
.voice-status{min-height:22px;margin-top:12px;text-align:center;color:#4b5563;font-size:15px;}
.voice-tools{display:flex;gap:10px;margin-top:12px;}
.voice-tools button{margin:0;font-size:18px;padding:12px 8px;}
.voice-repeat{background:#f59e0b;}
.voice-restart{background:#64748b;}

.footer{
 text-align:center;
 color:#666;
 font-size:15px;
 line-height:1.5;
 margin-top:22px;
 padding:10px 0 0;
 letter-spacing:0.04em;
}

.history-btn{
 margin-top:0;
 background:#16a34a;
 width:auto;
 min-width:72px;
 padding:10px 12px;
 font-size:16px;
 white-space:nowrap;
 flex:0 0 auto;
}

.history-list{
 display:flex;
 flex-direction:column;
 gap:10px;
 margin-top:12px;
}

.history-item{
 background:#eaf3ff;
 border:none;
 border-radius:10px;
 padding:12px;
 display:flex;
 align-items:stretch;
 gap:10px;
}

.history-main{
 flex:1;
 min-width:0;
 cursor:pointer;
 -webkit-tap-highlight-color: transparent;
}

.history-date{
 font-size:15px;
 color:#555;
 margin-bottom:6px;
}

.history-text{
 font-size:16px;
 line-height:1.55;
 color:#222;
 word-break:break-word;
}

.history-actions{
 display:flex;
 flex-direction:column;
 gap:8px;
 width:76px;
 flex:0 0 76px;
}

.history-actions button{
 width:100%;
 margin-top:0;
 padding:8px 6px;
 font-size:13px;
 border-radius:10px;
 min-height:38px;
}

.history-restore{
 background:#7898bc;
}

.history-delete{
 background:#c58f84;
}


.custom-ratio-box{
 display:none;
 margin-top:12px;
 padding:12px;
 background:rgba(255,255,255,0.72);
 border:1px solid #bfd4ef;
 border-radius:10px;
}

.custom-ratio-box.open{
 display:block;
}

.custom-ratio-title{
 font-size:16px;
 font-weight:bold;
 color:#1f2937;
 margin-bottom:8px;
}

.custom-ratio-row{
 display:grid;
 grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
 align-items:end;
 gap:10px;
}

.custom-ratio-field label{
 font-size:14px;
 margin-bottom:4px;
}

.custom-ratio-field input{
 width:100%;
 margin-top:0;
 padding:12px 10px;
 font-size:20px;
 border:1px solid #9bb7d7;
 background:#fff;
}

.custom-ratio-colon{
 font-size:28px;
 font-weight:bold;
 line-height:48px;
 color:#374151;
}

.custom-ratio-note{
 margin-top:8px;
 color:#555;
 font-size:13px;
 line-height:1.45;
}

.history-guide{
 margin-top:12px;
 padding:12px;
 background:#e8f5e9;
 border:2px solid #4caf50;
 border-radius:10px;
}

.history-count{
 margin-top:8px;
 color:#1f2937;
 font-size:14px;
 line-height:1.45;
 font-weight:normal;
}

@media (max-width: 420px){
 .history-btn{
  min-width:58px;
  padding:9px 8px;
  font-size:14px;
 }
 .history-actions{
  width:64px;
  flex-basis:64px;
 }
 .history-actions button{
  font-size:12px;
  padding:7px 4px;
 }
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.45);
 display:none;
 align-items:flex-end;
 justify-content:center;
 z-index:999;
 padding:12px;
}

.modal.open{
 display:flex;
}

.modal-panel{
 width:100%;
 max-width:720px;
 max-height:90vh;
 padding:12px;
 border-radius:18px 18px 12px 12px;
 overflow:hidden;
 box-shadow:0 10px 35px rgba(0,0,0,0.22);
 display:flex;
 flex-direction:column;
 background:
  radial-gradient(140px 95px at 10% 12%, rgba(255,72,72,0.16) 0%, rgba(255,72,72,0.11) 18%, rgba(255,72,72,0.00) 62%),
  radial-gradient(160px 120px at 88% 16%, rgba(255,159,28,0.14) 0%, rgba(255,159,28,0.09) 18%, rgba(255,159,28,0.00) 65%),
  radial-gradient(170px 130px at 18% 42%, rgba(255,235,59,0.13) 0%, rgba(255,235,59,0.08) 18%, rgba(255,235,59,0.00) 66%),
  radial-gradient(180px 140px at 82% 40%, rgba(76,175,80,0.12) 0%, rgba(76,175,80,0.08) 18%, rgba(76,175,80,0.00) 66%),
  radial-gradient(170px 130px at 38% 76%, rgba(0,188,212,0.13) 0%, rgba(0,188,212,0.08) 18%, rgba(0,188,212,0.00) 66%),
  radial-gradient(160px 120px at 92% 78%, rgba(63,81,181,0.12) 0%, rgba(63,81,181,0.08) 18%, rgba(63,81,181,0.00) 66%),
  radial-gradient(140px 100px at 58% 22%, rgba(156,39,176,0.10) 0%, rgba(156,39,176,0.06) 18%, rgba(156,39,176,0.00) 68%),
  radial-gradient(150px 110px at 68% 66%, rgba(255,105,180,0.10) 0%, rgba(255,105,180,0.06) 18%, rgba(255,105,180,0.00) 68%),
  linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.94));
}

.modal-header{
 background:#7898bc;
 color:white;
 padding:14px;
 border:none;
 border-radius:10px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
}

.modal-title{
 font-size:22px;
 font-weight:bold;
}

.modal-close{
 width:auto;
 margin:0;
 padding:10px 12px;
 font-size:16px;
 color:#1d4ed8;
 background:white;
 border:1px solid #dbeafe;
 border-radius:10px;
}

.modal-body{
 padding:0 2px 2px;
 overflow:auto;
}

.modal-tools{
 display:flex;
 gap:10px;
 margin-top:12px;
}

.modal-tools button{
 margin-top:0;
 padding:12px 10px;
 font-size:16px;
 border-radius:10px;
}

.modal-clearall{
 background:#c58f84;
}

.modal-empty{
 padding:18px 10px;
 color:#666;
 text-align:center;
 font-size:16px;
}

</style>
</head>

<body>

<h1 id="appTitle">塗料配合計算</h1>

<div class="header">
 <span class="header-title">配合設定</span>
 <button id="voiceStartBtn" class="voice-start" type="button" onclick="openVoiceInput()" aria-label="音声入力" title="音声入力">🎤</button>
</div>

<div id="voiceInlineStatus" class="voice-inline-status" role="status"></div>

<div class="weather-alert" id="weatherAlert" hidden role="status"></div>
<div class="weather-alert" id="heatstrokeAlert" hidden role="status"></div>

<div class="box info history-inline">
 <div class="history-inline-top">
  <div class="history-inline-label">前回使用</div>
  <button class="history-btn" onclick="openHistoryModal()">履歴</button>
 </div>
 <div class="history-inline-value" id="history">前回データなし</div>
</div>

<div class="box" id="ratioBox">
<label>配合比</label>
<select id="ratio"></select>
<div class="custom-ratio-box" id="customRatioBox">
 <div class="custom-ratio-title">その他の配合比を入力</div>
 <div class="custom-ratio-row">
  <div class="custom-ratio-field">
   <label for="customRatioMain">主剤</label>
   <input id="customRatioMain" type="number" inputmode="decimal" min="0.01" step="0.1" placeholder="例：7.5">
  </div>
  <div class="custom-ratio-colon">：</div>
  <div class="custom-ratio-field">
   <label for="customRatioHard">硬化剤</label>
   <input id="customRatioHard" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例：1">
  </div>
 </div>
 <div class="custom-ratio-note">主剤と硬化剤の比率をそれぞれ入力してください。</div>
</div>
</div>

<div class="box" id="baseBox">
<label style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
<span>主剤重量（kg）</span>
<span id="showActualBtn" onclick="showActualField()" style="font-size:14px;color:#0066cc;text-decoration:underline;cursor:pointer;font-weight:normal;">※多く入ったらこちらから修正</span>
</label>
<select id="base"></select>
</div>

<div class="box alert" id="actualBox">
<label style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
<span>実測主剤重量（kg）</span>
<button type="button" class="modal-close" onclick="hideActualField()">閉じる</button>
</label>
<div class="note">
実際に入った数値を入力
</div>
<select id="actual"></select>
</div>

<div class="box" id="thinnerBox">
<label>希釈率（％）</label>
<select id="thinner"></select>
</div>

<button onclick="calc()">
▶ 配合計算
</button>

<div id="result" class="result" tabindex="-1"></div>

<div class="footer" id="footerInfo"></div>

<div class="modal" id="historyModal" onclick="closeHistoryModal(event)">
 <div class="modal-panel" onclick="event.stopPropagation()">
  <div class="modal-header">
   <div class="modal-title">履歴</div>
   <button class="modal-close" onclick="closeHistoryModal()">閉じる</button>
  </div>
  <div class="modal-body">
   <div class="history-guide">
    <div class="note">タップすると、その内容を復元します。</div>
    <div class="history-count" id="historyCount"></div>
   </div>
   <div class="history-list" id="historyList"></div>
   <button class="modal-clearall" onclick="clearAllHistory()">履歴をすべて削除</button>
  </div>
 </div>
</div>

<div class="voice-overlay" id="voiceOverlay" aria-modal="true" role="dialog" aria-label="音声入力">
 <div class="voice-panel">
  <div class="voice-panel-header">
   <span>🎤 音声入力</span>
   <button type="button" class="voice-close" onclick="closeVoiceInput()">閉じる</button>
  </div>
  <div class="voice-body">
   <div class="voice-guide">順番に声で入力します</div>
   <div class="voice-list">
    <div class="voice-item active" data-voice-item="0">
     <div class="voice-item-top"><div class="voice-item-label">① 配合比</div><div class="voice-item-state" data-voice-state="0">聞き取り中</div></div>
     <div class="voice-item-value" data-voice-value="0">例：9対1</div>
    </div>
    <div class="voice-item" data-voice-item="1">
     <div class="voice-item-top"><div class="voice-item-label">② 主剤重量</div><div class="voice-item-state" data-voice-state="1">未入力</div></div>
     <div class="voice-item-value" data-voice-value="1">例：3キロ</div>
    </div>
    <div class="voice-item" data-voice-item="2">
     <div class="voice-item-top"><div class="voice-item-label">③ 希釈率</div><div class="voice-item-state" data-voice-state="2">未入力</div></div>
     <div class="voice-item-value" data-voice-value="2">例：10パーセント</div>
    </div>
   </div>
   <div class="voice-status" id="voiceStatus">マイクに向かって話してください</div>
   <div class="voice-tools">
    <button type="button" class="voice-repeat" onclick="repeatVoiceStep()">もう一度</button>
    <button type="button" class="voice-restart" onclick="restartVoiceInput()">最初から</button>
   </div>
  </div>
 </div>
</div>

<script>
// ===== 開発者設定 =====
const APP_NAME = "塗料配合計算";
const APP_VERSION = "Voice Test Ver.4.0";
const APP_DATE = "2026/08/07";
const APP_TIME = "21:33";
const HISTORY_MAX = 10;
const WEATHER_FORECAST_HOURS = 1;
const WEATHER_PROBABILITY_THRESHOLD = 80;
const HEATSTROKE_ALERT_URL = "https://www.wbgt.env.go.jp/alert.php";

// Ver.15.7の履歴・前回使用データには触れない。
const STORAGE_HISTORY = "paintVoiceTestHistory";
const STORAGE_LAST = "paintVoiceTestLastData";

// ===== 画面要素 =====
const appTitle = document.getElementById("appTitle");
const footerInfo = document.getElementById("footerInfo");
const weatherAlert = document.getElementById("weatherAlert");
const heatstrokeAlert = document.getElementById("heatstrokeAlert");
const ratioBox = document.getElementById("ratioBox");
const ratio = document.getElementById("ratio");
const customRatioBox = document.getElementById("customRatioBox");
const customRatioMain = document.getElementById("customRatioMain");
const customRatioHard = document.getElementById("customRatioHard");
const base = document.getElementById("base");
const actual = document.getElementById("actual");
const actualBox = document.getElementById("actualBox");
const showActualBtn = document.getElementById("showActualBtn");
const thinner = document.getElementById("thinner");
const result = document.getElementById("result");
const historyBox = document.getElementById("history");
const historyModal = document.getElementById("historyModal");
const historyList = document.getElementById("historyList");
const historyCount = document.getElementById("historyCount");
const voiceStartBtn = document.getElementById("voiceStartBtn");
const voiceOverlay = document.getElementById("voiceOverlay");
const voiceStatus = document.getElementById("voiceStatus");
const voiceItems = Array.from(document.querySelectorAll("[data-voice-item]"));
const voiceStates = Array.from(document.querySelectorAll("[data-voice-state]"));
const voiceValues = Array.from(document.querySelectorAll("[data-voice-value]"));

function initializeAppInfo(){
 document.title = APP_NAME;
 appTitle.textContent = APP_NAME;
 footerInfo.textContent = `Produced by N.H.S.　${APP_VERSION}　${APP_DATE} ${APP_TIME}`;
}

function showWeatherAlert(){
 weatherAlert.textContent = "⚠ 今後1時間以内に降雨の予報";
 weatherAlert.hidden = false;
}

function showHeatstrokeAlert(){
 heatstrokeAlert.textContent = "⚠ 千葉県に熱中症警戒アラートが発表されています";
 heatstrokeAlert.hidden = false;
}

async function updateHeatstrokeAlert(){
 if(!window.fetch || !window.DOMParser) return;

 try{
  const response = await fetch(HEATSTROKE_ALERT_URL);
  if(!response.ok) return;

  const html = await response.text();
  const documentForAlert = new DOMParser().parseFromString(html, "text/html");
  const chibaRow = Array.from(documentForAlert.querySelectorAll("tr")).find(row => {
   const cells = Array.from(row.querySelectorAll("th, td"));
   return cells.some(cell => cell.textContent.trim() === "千葉");
  });
  if(!chibaRow) return;

  const hasAlert = Array.from(chibaRow.querySelectorAll("td")).some(cell => {
   const text = cell.textContent.replace(/\s+/g, "");
   return text.includes("●") || text.includes("警戒アラート");
  });

  if(hasAlert) showHeatstrokeAlert();
 }catch(error){
  // アラート情報を取得できない場合は、通常どおり計算画面を表示する。
 }
}

async function updateRainAlert(){
 if(!navigator.geolocation || !window.fetch) return;

 navigator.geolocation.getCurrentPosition(async position => {
  try{
   const latitude = position.coords.latitude;
   const longitude = position.coords.longitude;
   const url = "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(latitude) +
    "&longitude=" + encodeURIComponent(longitude) +
    "&hourly=precipitation_probability&forecast_days=1&timezone=auto";
   const response = await fetch(url);
   if(!response.ok) return;

   const data = await response.json();
   const times = data.hourly && data.hourly.time;
   const probabilities = data.hourly && data.hourly.precipitation_probability;
   if(!Array.isArray(times) || !Array.isArray(probabilities)) return;

   const now = new Date();
   const endTime = new Date(now.getTime() + WEATHER_FORECAST_HOURS * 60 * 60 * 1000);
   const maxProbability = probabilities.reduce((maximum, probability, index) => {
    const forecastTime = new Date(times[index]);
    if(forecastTime >= now && forecastTime <= endTime){
     return Math.max(maximum, Number(probability) || 0);
    }
    return maximum;
   }, 0);

   if(maxProbability >= WEATHER_PROBABILITY_THRESHOLD){
    showWeatherAlert();
   }
  }catch(error){
   // 天気情報を取得できない場合は、通常どおり計算画面を表示する。
  }
 }, () => {
  // 位置情報が許可されない場合は、通常どおり計算画面を表示する。
 }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
}

function formatRatioNumber(value){

 return Number.isFinite(number) ? String(number) : "";

 if(item && item.ratio === "custom"){
  const mainValue = formatRatioNumber(item.customRatioMain);
  const hardValue = formatRatioNumber(item.customRatioHard);
  return mainValue !== "" && hardValue !== "" ? `${mainValue}:${hardValue}` : "その他（手入力）";
 }
 return item && item.ratio ? item.ratio : "";
}

function getCurrentRatioInfo(){
 if(ratio.value === "custom"){
  const mainValue = Number(customRatioMain.value);
  const hardValue = Number(customRatioHard.value);

  if(customRatioMain.value === "" || customRatioHard.value === ""){
   return { error: "その他の配合比（主剤・硬化剤）を入力してください" };
  }
  if(!Number.isFinite(mainValue) || !Number.isFinite(hardValue) || mainValue <= 0 || hardValue < 0){
   return { error: "配合比は、主剤を0より大きく、硬化剤を0以上で入力してください" };
  }

  return {
   value: "custom",
   label: `${formatRatioNumber(mainValue)}:${formatRatioNumber(hardValue)}`,
   mainPart: mainValue,
   hardPart: hardValue,
   customRatioMain: formatRatioNumber(mainValue),
   customRatioHard: formatRatioNumber(hardValue)
  };
 }

 const parts = ratio.value.split(":").map(Number);
 if(parts.length !== 2 || !Number.isFinite(parts[0]) || !Number.isFinite(parts[1]) || parts[0] <= 0 || parts[1] < 0){
  return { error: "配合比を選択してください" };
 }

 return {
  value: ratio.value,
  label: ratio.value,
  mainPart: parts[0],
  hardPart: parts[1],
  customRatioMain: "",
  customRatioHard: ""
 };
}

  date: new Date().toLocaleString("ja-JP"),

  ratioLabel: ratioInfo.label,
  customRatioMain: ratioInfo.customRatioMain,

function calc(){
 if(ratio.value === "" || base.value === "" || thinner.value === ""){
  alert("配合比・主剤重量・希釈率を選択してください");
  return;
 }

 const ratioInfo = getCurrentRatioInfo();
 if(ratioInfo.error){
  alert(ratioInfo.error);
  return;
 }

 const main = actualBox.style.display === "block" && actual.value !== ""
  ? Number(actual.value)
  : Number(base.value);

 const hard = main * ratioInfo.hardPart / ratioInfo.mainPart;
 const mix = main + hard;
 const thin = mix * Number(thinner.value) / 100;
 const total = mix + thin;
 const hasThin = Number(thinner.value) > 0;
 const hasHardener = Math.abs(hard) > 1e-12;

 if(!hasHardener){
  result.innerHTML =
   `<div class="step">主剤（${ratioInfo.label}）ここまで入れる<div class="value">${main.toFixed(2)}kg</div></div>` +
   (hasThin
    ? `<div class="step">希釈剤（${thinner.value}％） ${thin.toFixed(2)}kg 入れる<div class="value">${total.toFixed(2)}kg</div></div>`
    : "");
 }else{
  result.innerHTML =
   `<div class="step">主剤（${ratioInfo.label}）ここまで入れる<div class="value">${main.toFixed(2)}kg</div></div>` +
   `<div class="step">硬化剤 ${hard.toFixed(2)}kg 入れる<div class="value">${mix.toFixed(2)}kg</div></div>` +
   (hasThin
    ? `<div class="step">希釈剤（${thinner.value}％） ${thin.toFixed(2)}kg 入れる<div class="value">${total.toFixed(2)}kg</div></div>`
    : "");
 }

 saveData(ratioInfo);

 actual.value = "";
 actualBox.style.display = "none";
 if(showActualBtn) showActualBtn.style.display = "inline";

 smoothScrollTo(result, "start");
}

// ===== 音声入力試作 =====
const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceRecognition = null;
let voiceStepIndex = 0;
let voiceIsListening = false;
let voiceRetryTimer = null;
let voiceAwaitingThinnerApproval = false;
let voiceAwaitingActualChoice = false;
let voiceAwaitingActualWeight = false;
let voiceSpeechToken = 0;
const voiceSteps = [
 { label:"① 配合比", question:"配合比をどうぞ", example:"例：9対1" },
 { label:"② 主剤重量", question:"主剤重量をどうぞ", example:"例：3キロ" },
 { label:"③ 希釈率", question:"希釈率をどうぞ", example:"例：10パーセント" }
];

function normalizeVoiceText(text){
 const kanjiDigits = { "〇":"0", "零":"0", "一":"1", "二":"2", "三":"3", "四":"4", "五":"5", "六":"6", "七":"7", "八":"8", "九":"9" };
 return text
  .replace(/[〇零一二三四五六七八九]/g, character => kanjiDigits[character])
  .replace(/[：:]/g, "対")
  .replace(/たい|対|to/gi, "対")
  .replace(/キログラム|キロ|kg/gi, "")
  .replace(/パーセント|％|%/gi, "")
  .replace(/[\s、。]/g, "");
}

function parseVoiceValue(text){
 const normalized = normalizeVoiceText(text);
 if(voiceStepIndex === 0){
  const match = normalized.match(/(10|[1-9])対(10|[0-9])/);
  if(!match) return null;
  const value = `${match[1]}:${match[2]}`;
  return Array.from(ratio.options).some(option => option.value === value) ? value : null;
 }
 const match = normalized.match(/\d+(?:\.\d+)?/);
 if(!match) return null;
 const number = Number(match[0]);
 if(voiceStepIndex === 1){
  if(number < 0.5 || number > 20 || Math.abs(number * 2 - Math.round(number * 2)) > 0.001) return null;
  return number.toFixed(1);
 }
 if(number < 0 || number > 30 || !Number.isInteger(number)) return null;
 return String(number);
}

function renderVoiceStep(){
 voiceItems.forEach((item, index) => {
  item.classList.toggle("active", index === voiceStepIndex);
  item.classList.toggle("done", index < voiceStepIndex);
  item.classList.remove("error");
  if(index < voiceStepIndex){
   voiceStates[index].textContent = "完了 ✓";
  }else if(index === voiceStepIndex){
   voiceStates[index].innerHTML = '聞き取り中<span class="voice-listening-dots" aria-hidden="true"><i></i><i></i><i></i></span>';
   voiceValues[index].textContent = voiceSteps[index].example;
  }else{
   voiceStates[index].textContent = "未入力";
   voiceValues[index].textContent = voiceSteps[index].example;
  }
 });
 voiceStatus.textContent = "マイクに向かって話してください";
}

function showVoiceRecognitionFailure(message){
 const item = voiceItems[voiceStepIndex];
 item.classList.remove("active");
 item.classList.add("error");
 voiceStates[voiceStepIndex].textContent = "確認できません";
 voiceStatus.textContent = message;
}

function clearVoiceRetry(){
 if(voiceRetryTimer) clearTimeout(voiceRetryTimer);
 voiceRetryTimer = null;
}

function retryVoiceStep(message){
 clearVoiceRetry();
 showVoiceRecognitionFailure(message);
 playVoiceTone("warning");
 voiceRetryTimer = window.setTimeout(() => {
  voiceRetryTimer = null;
  if(!voiceOverlay.classList.contains("open")) return;
  renderVoiceStep();
  startVoiceListening();
 }, 1200);
}

function stopVoiceSpeech(){
 voiceSpeechToken += 1;
}

function speakVoice(text, afterSpeak){
 playVoiceTone("confirm");
 if(typeof afterSpeak === "function") window.setTimeout(afterSpeak, 140);
}

function playVoiceTone(type){
 const AudioContextClass = window.AudioContext || window.webkitAudioContext;
 if(!AudioContextClass) return;
 try{
  const context = new AudioContextClass();
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  oscillator.type = "sine";
  oscillator.frequency.value = type === "warning" ? 380 : 780;
  gain.gain.setValueAtTime(0.0001, context.currentTime);
  gain.gain.exponentialRampToValueAtTime(type === "warning" ? 0.10 : 0.075, context.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + (type === "warning" ? 0.20 : 0.11));
  oscillator.connect(gain).connect(context.destination);
  oscillator.start();
  oscillator.stop(context.currentTime + (type === "warning" ? 0.21 : 0.12));
  oscillator.onended = () => context.close();
 }catch(error){}
}

function advanceVoiceStep(){
 if(voiceStepIndex < voiceSteps.length - 1){
  voiceStepIndex += 1;
  window.setTimeout(() => {
   if(!voiceOverlay.classList.contains("open")) return;
   // Safariでは、終了済みの認識インスタンスを再利用すると次の項目で止まることがある。
   voiceRecognition = createVoiceRecognition();
   renderVoiceStep();
   startVoiceListening();
  }, 700);
 }else{
  window.setTimeout(() => {
   const isReloading = closeVoiceInput(true);
   if(!isReloading) calc();
  }, 300);
 }
}

function waitForThinnerApproval(value){
 voiceAwaitingThinnerApproval = true;
 voiceItems[voiceStepIndex].classList.remove("done");
 voiceItems[voiceStepIndex].classList.add("active");
 voiceStates[voiceStepIndex].textContent = "確認待ち";
 const message = `希釈率、${value}パーセントですね。かなり多めですが大丈夫ですか？`;
 voiceStatus.textContent = message;
 speakVoice(message, () => {
  if(!voiceOverlay.classList.contains("open") || !voiceAwaitingThinnerApproval) return;
  voiceStates[voiceStepIndex].textContent = "返答待ち";
  voiceStatus.textContent = "大丈夫です、または、やり直し、と話してください";
  startVoiceListening();
 });
}

function handleThinnerApproval(normalized){
 if(/大丈夫|問題ない|はい|OK|オーケー/i.test(normalized)){
  voiceAwaitingThinnerApproval = false;
  voiceStates[voiceStepIndex].textContent = "完了 ✓";
  voiceItems[voiceStepIndex].classList.remove("active");
  voiceItems[voiceStepIndex].classList.add("done");
  speakVoice("承知しました", advanceVoiceStep);
  return;
 }
 if(/やり直|いいえ|違う|戻/i.test(normalized)){
  voiceAwaitingThinnerApproval = false;
  speakVoice("もう一度、希釈率をどうぞ", () => {
   if(!voiceOverlay.classList.contains("open")) return;
   renderVoiceStep();
   startVoiceListening();
  });
  return;
 }
 voiceStatus.textContent = "大丈夫です、または、やり直し、と話してください";
 startVoiceListening();
}

function createVoiceRecognition(){
 if(!SpeechRecognitionClass) return null;
 const recognition = new SpeechRecognitionClass();
 recognition.lang = "ja-JP";
 recognition.continuous = false;
 recognition.interimResults = true;
 recognition.maxAlternatives = 1;
 recognition.onresult = event => {
 const text = Array.from(event.results).map(result => result[0].transcript).join("").trim();
  if(text){
   voiceValues[voiceStepIndex].textContent = text;
   if(voiceOverlay.classList.contains("open")){
    setInlineVoiceStatus(`${voiceSteps[voiceStepIndex].label}を聞き取り中`, text, true);
   }
  }
  const finalResult = event.results[event.results.length - 1];
  if(finalResult && finalResult.isFinal) handleVoiceResult(text);
 };
 recognition.onerror = event => {
  voiceIsListening = false;
  if(event.error === "not-allowed" || event.error === "service-not-allowed"){
   clearVoiceRetry();
   voiceStatus.textContent = "通常の入力操作をご利用ください";
  }else if(event.error !== "aborted"){
   retryVoiceStep("聞き取れませんでした。もう一度聞き取ります…");
  }
 };
 recognition.onend = () => { voiceIsListening = false; };
 return recognition;
}

function startVoiceListening(){
 if(!voiceRecognition || !voiceOverlay.classList.contains("open")) return;
 try{
  voiceIsListening = true;
  voiceRecognition.start();
 }catch(error){
  // Chromeで認識開始が失敗した場合、聞き取り中のまま止めずに作り直す。
  voiceIsListening = false;
  voiceStatus.textContent = "音声入力を開始し直しています…";
  window.setTimeout(() => {
   if(!voiceOverlay.classList.contains("open")) return;
   voiceRecognition = createVoiceRecognition();
   try{
    voiceIsListening = true;
    voiceRecognition.start();
   }catch(retryError){
    voiceIsListening = false;
    showVoiceRecognitionFailure("音声入力を開始できませんでした。もう一度を押してください");
   }
  }, 350);
 }
}

function handleVoiceResult(text){
 const normalized = normalizeVoiceText(text);
 if(normalized.includes("最初から")){
  restartVoiceInput();
  return;
 }
 if(voiceAwaitingThinnerApproval){
  handleThinnerApproval(normalized);
  return;
 }
 if(voiceAwaitingActualChoice){
  if(normalized.includes("多く入っ") || normalized.includes("実測")){
   voiceAwaitingActualChoice = false;
   voiceAwaitingActualWeight = true;
   voiceItems[1].classList.add("active");
   voiceStates[1].textContent = "実測を聞き取り中";
   voiceValues[1].textContent = "実測主剤重量をどうぞ";
   voiceStatus.textContent = "実測主剤重量をどうぞ";
   if(voiceRecognition && voiceIsListening){ try{ voiceRecognition.abort(); }catch(error){} }
   voiceIsListening = false;
   speakVoice("実測主剤重量をどうぞ");
   window.setTimeout(() => { voiceRecognition = createVoiceRecognition(); startVoiceListening(); }, 900);
   return;
  }
  // 「10パーセント」などは、そのまま③希釈率として受け取る。
  voiceAwaitingActualChoice = false;
  advanceVoiceStep();
  window.setTimeout(() => handleVoiceResult(text), 800);
  return;
 }
 if(voiceAwaitingActualWeight){
  const match = normalized.match(/\d+(?:\.\d+)?/);
  const actualValue = match ? Number(match[0]) : NaN;
  if(!Number.isFinite(actualValue) || actualValue < Number(base.value) || actualValue > 20.5){
   retryVoiceStep("実測主剤重量をもう一度どうぞ");
   return;
  }
  voiceAwaitingActualWeight = false;
  showActualField();
  actual.value = actualValue.toFixed(1);
  voiceStates[1].textContent = "実測に修正 ✓";
  voiceValues[1].textContent = `${actual.value}kg`;
  voiceItems[1].classList.remove("active");
  voiceItems[1].classList.add("done");
  voiceStatus.textContent = "実測主剤重量を修正しました";
  if(voiceRecognition && voiceIsListening){ try{ voiceRecognition.abort(); }catch(error){} }
  voiceIsListening = false;
  speakVoice(`実測主剤重量、${actual.value}キロに修正しました`);
  window.setTimeout(advanceVoiceStep, 250);
  return;
 }
 if(normalized.includes("もう1度") || normalized.includes("もう一度")){
  repeatVoiceStep();
  return;
 }
 const value = parseVoiceValue(text);
 if(value === null){
  retryVoiceStep("確認できませんでした。もう一度聞き取ります…");
  return;
 }

 if(voiceStepIndex === 0) ratio.value = value;
 if(voiceStepIndex === 1) base.value = value;
 if(voiceStepIndex === 2) thinner.value = value;
 updateCustomRatioUI();
 updateActual();
 updateThinnerUI();
 clearResult();
 voiceValues[voiceStepIndex].textContent = voiceStepIndex === 0 ? value.replace(":", "：") : voiceStepIndex === 1 ? `${value}kg` : `${value}％`;
 voiceStates[voiceStepIndex].textContent = "完了 ✓";
 voiceItems[voiceStepIndex].classList.remove("active");
 voiceItems[voiceStepIndex].classList.add("done");
 const thinnerValue = Number(value);
 if(voiceStepIndex === 2 && thinnerValue >= 21){
  waitForThinnerApproval(value);
  return;
 }
 if(voiceStepIndex === 1){
  voiceAwaitingActualChoice = true;
  voiceStates[1].textContent = "完了 ✓";
  voiceValues[1].textContent = `${value}kg　多く入った場合は「多く入った」と話してください`;
  voiceStatus.textContent = "多く入った場合は、多く入った。通常は、希釈率をどうぞ";
  if(voiceRecognition && voiceIsListening){ try{ voiceRecognition.abort(); }catch(error){} }
  voiceIsListening = false;
  speakVoice(`はい、${Number(value)}キロですね。多く入った場合は、多く入った。通常は、希釈率をどうぞ`);
  window.setTimeout(() => { voiceRecognition = createVoiceRecognition(); startVoiceListening(); }, 1800);
  return;
 }
 const message = voiceStepIndex === 0
  ? `はい、${value.replace(":", "対")}ですね`
  : voiceStepIndex === 1
   ? `はい、${Number(value)}キロですね`
   : thinnerValue >= 14
    ? `希釈率、${value}パーセントですね。少し多めです`
    : `希釈率、${value}パーセントですね`;
 voiceStatus.textContent = message;
 // 読み上げの onend を待つと、Safariでは次の認識開始が呼ばれない場合がある。
 // 現在の認識を先に閉じ、読み上げとは独立して次の項目へ進める。
 if(voiceRecognition && voiceIsListening){
  try{ voiceRecognition.abort(); }catch(error){}
 }
 voiceIsListening = false;
 speakVoice(message);
 window.setTimeout(advanceVoiceStep, 250);
}

function openVoiceInput(){
 if(!SpeechRecognitionClass) return;
 closeHistoryModal();
 voiceRecognition = createVoiceRecognition();
 voiceStepIndex = 0;
 voiceAwaitingThinnerApproval = false;
 voiceAwaitingActualChoice = false;
 voiceAwaitingActualWeight = false;
 stopVoiceSpeech();
 voiceOverlay.classList.add("open");
 document.body.style.overflow = "hidden";
 renderVoiceStep();
 startVoiceListening();
}

function releaseVoiceRecognition(){
 const recognition = voiceRecognition;
 voiceRecognition = null;
 if(!recognition) return;
 // iPhone Safariでは、状態表示と実際のマイク使用状態がずれる場合がある。
 // コールバックを外してから必ず停止し、音声入力終了後にマイクを残さない。
 try{ recognition.onresult = null; recognition.onerror = null; recognition.onend = null; }catch(error){}
 try{ recognition.abort(); }catch(error){ try{ recognition.stop(); }catch(stopError){} }
}

function closeVoiceInput(calculateAfterReload = false){
 clearVoiceRetry();
 voiceAwaitingThinnerApproval = false;
 voiceAwaitingActualChoice = false;
 voiceAwaitingActualWeight = false;
 stopVoiceSpeech();
 releaseVoiceRecognition();
 voiceIsListening = false;
 voiceOverlay.classList.remove("open");
 document.body.style.overflow = "";
 if(isIPhoneVoiceInput() && saveVoiceReloadState(calculateAfterReload)){
  window.setTimeout(() => window.location.reload(), 100);
  return true;
 }
 return false;
}

function repeatVoiceStep(){
 if(!voiceOverlay.classList.contains("open")) return;
 clearVoiceRetry();
 voiceAwaitingThinnerApproval = false;
 voiceAwaitingActualChoice = false;
 voiceAwaitingActualWeight = false;
 stopVoiceSpeech();
 if(voiceRecognition && voiceIsListening){
  try{ voiceRecognition.abort(); }catch(error){}
 }
 renderVoiceStep();
 window.setTimeout(startVoiceListening, 120);
}

function restartVoiceInput(){
 clearVoiceRetry();
 voiceAwaitingThinnerApproval = false;
 voiceAwaitingActualChoice = false;
 voiceAwaitingActualWeight = false;
 stopVoiceSpeech();
 if(voiceRecognition && voiceIsListening){
  try{ voiceRecognition.abort(); }catch(error){}
 }
 voiceStepIndex = 0;
 renderVoiceStep();
 window.setTimeout(startVoiceListening, 120);
}

// ===== トップ画面で行う音声入力 =====
const voiceInlineStatus = document.getElementById("voiceInlineStatus");
const voiceInputBoxes = [ratioBox, document.getElementById("baseBox"), document.getElementById("thinnerBox")];
const VOICE_RELOAD_STATE = "paintVoiceTestReloadState";

function escapeVoiceText(text){
 const container = document.createElement("div");
 container.textContent = text;
 return container.innerHTML;
}

function setInlineVoiceStatus(message, heardText = "", isListening = false){
 const dots = isListening
  ? '<span class="voice-listening-dots" aria-label="聞き取り中"><i></i><i></i><i></i></span>'
  : "";
 const heard = heardText
  ? `<div class="voice-inline-heard">聞こえた内容：${escapeVoiceText(heardText)}</div>`
  : "";
 voiceInlineStatus.classList.add("open");
 voiceInlineStatus.innerHTML = `<div>${message}${dots}</div>${heard}`;
}

function isIPhoneVoiceInput(){
 return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function saveVoiceReloadState(calculateAfterReload){
 try{
  sessionStorage.setItem(VOICE_RELOAD_STATE, JSON.stringify({
   ratio: ratio.value,
   customRatioMain: customRatioMain.value,
   customRatioHard: customRatioHard.value,
   base: base.value,
   actual: actual.value,
   actualOpen: actualBox.style.display === "block",
   thinner: thinner.value,
   calculate: Boolean(calculateAfterReload)
  }));
  return true;
 }catch(error){
  return false;
 }
}

function restoreVoiceReloadState(){
 let state;
 try{
  const raw = sessionStorage.getItem(VOICE_RELOAD_STATE);
  if(!raw) return;
  sessionStorage.removeItem(VOICE_RELOAD_STATE);
  state = JSON.parse(raw);
 }catch(error){
  return;
 }
 if(!state || typeof state !== "object") return;
 ratio.value = state.ratio || "";
 customRatioMain.value = state.customRatioMain || "";
 customRatioHard.value = state.customRatioHard || "";
 base.value = state.base || "";
 updateCustomRatioUI();
 updateActual();
 thinner.value = state.thinner ?? "";
 updateThinnerUI();
 if(state.actualOpen){
  actualBox.style.display = "block";
  if(showActualBtn) showActualBtn.style.display = "none";
  actual.value = state.actual || "";
 }
 if(state.calculate) window.setTimeout(calc, 80);
}

function renderInlineVoiceStep(){
 voiceInputBoxes.forEach((box, index) => box.classList.toggle("voice-inline-active", index === voiceStepIndex));
 setInlineVoiceStatus(`${voiceSteps[voiceStepIndex].label}を聞き取り中：${voiceSteps[voiceStepIndex].example}`, "", true);
}

function showInlineVoiceRecognitionFailure(message){
 setInlineVoiceStatus(message);
}

function advanceInlineVoiceStep(){
 if(voiceStepIndex >= voiceSteps.length - 1){
  const isReloading = closeVoiceInput(true);
  if(!isReloading) calc();
  return;
 }
 voiceStepIndex += 1;
 window.setTimeout(() => {
  if(!voiceOverlay.classList.contains("open")) return;
  // iPhone Safariだけは認識処理を作り直す。PC Chromeは同じ処理を使い、許可画面を繰り返さない。
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)) voiceRecognition = createVoiceRecognition();
  renderVoiceStep();
  startVoiceListening();
 }, 300);
}

function handleInlineVoiceResult(text){
 const normalized = normalizeVoiceText(text);
 if(normalized.includes("最初から")){ restartVoiceInput(); return; }
 const value = parseVoiceValue(text);
 if(value === null){ retryVoiceStep("確認できませんでした。もう一度聞き取ります…"); return; }
 if(voiceStepIndex === 0) ratio.value = value;
 if(voiceStepIndex === 1) base.value = value;
 if(voiceStepIndex === 2) thinner.value = value;
 updateCustomRatioUI(); updateActual(); updateThinnerUI(); clearResult();
 setInlineVoiceStatus(`${voiceSteps[voiceStepIndex].label}：${voiceStepIndex === 0 ? value.replace(":", "：") : voiceStepIndex === 1 ? `${value}kg` : `${value}％`}　完了 ✓`, text);
 if(voiceRecognition && voiceIsListening){ try{ voiceRecognition.abort(); }catch(error){} }
 voiceIsListening = false;
 speakVoice("入力完了");
 window.setTimeout(advanceVoiceStep, 120);
}

function openInlineVoiceInput(){
 if(!SpeechRecognitionClass) return;
 closeHistoryModal();
 voiceRecognition = createVoiceRecognition();
 voiceStepIndex = 0;
 voiceOverlay.classList.add("open");
 renderVoiceStep();
 startVoiceListening();
}

function closeInlineVoiceInput(calculateAfterReload = false){
 clearVoiceRetry();
 releaseVoiceRecognition();
 voiceIsListening = false;
 voiceOverlay.classList.remove("open");
 voiceInputBoxes.forEach(box => box.classList.remove("voice-inline-active"));
 voiceInlineStatus.classList.remove("open");
 if(isIPhoneVoiceInput() && saveVoiceReloadState(calculateAfterReload)){
  window.setTimeout(() => window.location.reload(), 100);
  return true;
 }
 return false;
}

function restartInlineVoiceInput(){
 if(voiceRecognition && voiceIsListening){ try{ voiceRecognition.abort(); }catch(error){} }
 voiceRecognition = createVoiceRecognition(); voiceStepIndex = 0; renderVoiceStep(); window.setTimeout(startVoiceListening, 200);
}

function repeatInlineVoiceStep(){ restartInlineVoiceInput(); }

// iPhone Safariを閉じる・別アプリへ移る時も、認識処理を残さない。
function stopVoiceInputForPageExit(){
 clearVoiceRetry();
 releaseVoiceRecognition();
 voiceIsListening = false;
 voiceOverlay.classList.remove("open");
 voiceInputBoxes.forEach(box => box.classList.remove("voice-inline-active"));
 voiceInlineStatus.classList.remove("open");
}

window.addEventListener("pagehide", stopVoiceInputForPageExit);
document.addEventListener("visibilitychange", () => {
 if(document.visibilityState === "hidden") stopVoiceInputForPageExit();
});

if(!SpeechRecognitionClass){
 voiceStartBtn.hidden = true;
}

initializeAppInfo();
updateThinnerUI();
loadData();
restoreVoiceReloadState();
updateRainAlert();
updateHeatstrokeAlert();
</script>
