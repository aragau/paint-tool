html{

h1{
 text-align:center;
 font-size:26px;
 margin: 8px 0 10px;
}

.header{
 background:#2d6cdf;
 color:white;
 font-size:22px;
 font-weight:bold;
 text-align:center;
 padding:14px;
 border-radius:10px;
}

.weather-alert{
 background:#fff1f0;
 border:1px solid #eea9a2;
 color:#b42318;
 margin-top:12px;
 padding:11px 12px;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 line-height:1.45;
}

.weather-status{
 margin-top:8px;
 color:#5b6472;
 font-size:13px;
 line-height:1.45;
 text-align:center;
}
.weather-status.error{
 color:#b42318;
}

.wbgt-info{
 margin-top:8px;
 padding:10px 12px;
 border:1px solid #b7c5d7;
 border-radius:10px;
 background:#f4f8fc;
 color:#334155;
 font-size:14px;
 line-height:1.5;
}
.wbgt-info.warning{
 border-color:#e48b19;
 background:#fff4df;
 color:#a85600;
 font-weight:bold;
}
.wbgt-info.error{
 border-color:#e4a09a;
 background:#fff5f3;
 color:#b42318;
}

.box{
 background:#eaf3ff;
 margin-top:12px;
 padding:12px;
 border-radius:10px;
}

.alert{
 background:#fff3e0;
 border:2px solid #ff9800;
}

.info{
 background:#e8f5e9;
 border:2px solid #4caf50;
 font-size:16px;
}

.history-inline{
 display:flex;
 flex-direction:column;
 gap:10px;
 margin-top:12px;
 padding:10px 12px;
}

.history-inline-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.history-inline-label{
 flex:1 1 auto;
 min-width:0;
 font-weight:bold;
 font-size:15px;
 color:#1f2937;
 white-space:nowrap;
}

.history-inline-value{
 font-size:14px;
 line-height:1.45;
 color:#111827;
 word-break:break-word;
}

label{
 display:block;
 font-weight:bold;
 font-size:20px;
}

.note{
 color:#cc6600;
 font-size:15px;
 line-height:1.4;
}

select,input,button{
 width:100%;
 margin-top:8px;
 padding:14px;
 font-size:22px;
 border-radius:8px;
}

button{
 background:#2d6cdf;
 color:white;
 border:none;
 font-weight:bold;
 cursor:pointer;
}

button:active{
 transform: translateY(1px);
}

.btn-sub{
 background:#ff9800;
 font-size:18px;
 margin-top:12px;
 padding:10px;
}

.btn-gray{
 background:#6b7280;
 font-size:18px;
}

.result{
 background:#f5f5f5;
 margin-top:18px;
 padding:15px;
 border-radius:10px;
 min-height:30px;
}

.step{
 text-align:center;
 margin-bottom:18px;
}

.value{
 color:#d96c2f;
 font-size:36px;
 font-weight:bold;
}

#actualBox {
 display: none;
}
.thin-note{
 margin-top:8px;
 font-size:15px;
 font-weight:bold;
}

.footer{
 text-align:center;
 color:#666;
 font-size:15px;
 line-height:1.5;
 margin-top:22px;
 padding:10px 0 0;
 letter-spacing:0.04em;
}

.history-btn{
 margin-top:0;
 background:#16a34a;
 width:auto;
 min-width:72px;
 padding:10px 12px;
 font-size:16px;
 white-space:nowrap;
 flex:0 0 auto;
}

.history-list{
 display:flex;
 flex-direction:column;
 gap:10px;
 margin-top:12px;
}

.history-item{
 background:#eaf3ff;
 border:none;
 border-radius:10px;
 padding:12px;
 display:flex;
 align-items:stretch;
 gap:10px;
}

.history-main{
 flex:1;
 min-width:0;
 cursor:pointer;
 -webkit-tap-highlight-color: transparent;
}

.history-date{
 font-size:15px;
 color:#555;
 margin-bottom:6px;
}

.history-text{
 font-size:16px;
 line-height:1.55;
 color:#222;
 word-break:break-word;
}

.history-actions{
 display:flex;
 flex-direction:column;
 gap:8px;
 width:76px;
 flex:0 0 76px;
}

.history-actions button{
 width:100%;
 margin-top:0;
 padding:8px 6px;
 font-size:13px;
 border-radius:10px;
 min-height:38px;
}

.history-restore{
 background:#7898bc;
}

.history-delete{
 background:#c58f84;
}


.custom-ratio-box{
 display:none;
 margin-top:12px;
 padding:12px;
 background:rgba(255,255,255,0.72);
 border:1px solid #bfd4ef;
 border-radius:10px;
}

.custom-ratio-box.open{
 display:block;
}

.custom-ratio-title{
 font-size:16px;
 font-weight:bold;
 color:#1f2937;
 margin-bottom:8px;
}

.custom-ratio-row{
 display:grid;
 grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
 align-items:end;
 gap:10px;
}

.custom-ratio-field label{
 font-size:14px;
 margin-bottom:4px;
}

.custom-ratio-field input{
 width:100%;
 margin-top:0;
 padding:12px 10px;
 font-size:20px;
 border:1px solid #9bb7d7;
 background:#fff;
}

.custom-ratio-colon{
 font-size:28px;
 font-weight:bold;
 line-height:48px;
 color:#374151;
}

.custom-ratio-note{
 margin-top:8px;
 color:#555;
 font-size:13px;
 line-height:1.45;
}

.history-guide{
 margin-top:12px;
 padding:12px;
 background:#e8f5e9;
 border:2px solid #4caf50;
 border-radius:10px;
}

.history-count{
 margin-top:8px;
 color:#1f2937;
 font-size:14px;
 line-height:1.45;
 font-weight:normal;
}

@media (max-width: 420px){
 .history-btn{
  min-width:58px;
  padding:9px 8px;
  font-size:14px;
 }
 .history-actions{
  width:64px;
  flex-basis:64px;
 }
 .history-actions button{
  font-size:12px;
  padding:7px 4px;
 }
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.45);
 display:none;
 align-items:flex-end;
 justify-content:center;
 z-index:999;
 padding:12px;
}

.modal.open{
 display:flex;
}

.modal-panel{
 width:100%;
 max-width:720px;
 max-height:90vh;
 padding:12px;
 border-radius:18px 18px 12px 12px;
 overflow:hidden;
 box-shadow:0 10px 35px rgba(0,0,0,0.22);
 display:flex;
 flex-direction:column;
 background:
  radial-gradient(140px 95px at 10% 12%, rgba(255,72,72,0.16) 0%, rgba(255,72,72,0.11) 18%, rgba(255,72,72,0.00) 62%),
  radial-gradient(160px 120px at 88% 16%, rgba(255,159,28,0.14) 0%, rgba(255,159,28,0.09) 18%, rgba(255,159,28,0.00) 65%),
  radial-gradient(170px 130px at 18% 42%, rgba(255,235,59,0.13) 0%, rgba(255,235,59,0.08) 18%, rgba(255,235,59,0.00) 66%),
  radial-gradient(180px 140px at 82% 40%, rgba(76,175,80,0.12) 0%, rgba(76,175,80,0.08) 18%, rgba(76,175,80,0.00) 66%),

  radial-gradient(160px 120px at 92% 78%, rgba(63,81,181,0.12) 0%, rgba(63,81,181,0.08) 18%, rgba(63,81,181,0.00) 66%),
  radial-gradient(140px 100px at 58% 22%, rgba(156,39,176,0.10) 0%, rgba(156,39,176,0.06) 18%, rgba(156,39,176,0.00) 68%),

.modal-header{
 background:#7898bc;
 color:white;
 padding:14px;
 border:none;
 border-radius:10px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
}

.modal-title{
 font-size:22px;
 font-weight:bold;
}

.modal-close{
 width:auto;
 margin:0;
 padding:10px 12px;
 font-size:16px;
 color:#1d4ed8;
 background:white;
 border:1px solid #dbeafe;
 border-radius:10px;
}

.modal-body{
 padding:0 2px 2px;
 overflow:auto;
}

.modal-tools{
 display:flex;
 gap:10px;
 margin-top:12px;
}

.modal-tools button{
 margin-top:0;
 padding:12px 10px;
 font-size:16px;
 border-radius:10px;
}

.modal-clearall{
 background:#c58f84;
}

.modal-empty{
 padding:18px 10px;
 color:#666;
 text-align:center;
 font-size:16px;
}

.mode-switch{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.mode-switch button{
 margin-top:0;
 background:#7898bc;
 font-size:18px;
 padding:12px 8px;
}
.mode-switch button.active{background:#2d6cdf;}
.area-only{display:none;}
.area-only.open{display:block;}
.area-guide{
 margin-top:10px;
 padding:10px 12px;
 background:#e8f5e9;
 border:2px solid #4caf50;
 border-radius:10px;
 font-size:15px;
 line-height:1.5;
}

<body>

<h1 id="appTitle">塗料配合計算　面積逆算版 Ver.1.12</h1>

<div class="header">
配合設定
</div>

<div class="weather-alert" id="weatherAlert" hidden role="status"></div>
<div class="weather-status" id="weatherStatus" role="status">降雨情報を確認中…</div>
<div class="wbgt-info" id="wbgtInfo" role="status">暑さ指数を確認中…</div>

<div class="box info history-inline">
 <div class="history-inline-top">
  <div class="history-inline-label">前回使用</div>
  <button class="history-btn" onclick="openHistoryModal()">履歴</button>
 </div>
 <div class="history-inline-value" id="history">前回データなし</div>
</div>

<div class="box">
 <div class="mode-switch">
  <button type="button" class="active" id="normalModeBtn">通常の配合</button>
  <button type="button" id="areaModeBtn">面積から計算</button>
 </div>
 <div class="area-guide" id="normalGuide">主剤重量から硬化剤・希釈剤を計算します。</div>
</div>

<div class="box area-only" id="areaBox">
 <label>塗装面積（㎡）</label>
 <select id="paintArea"></select>
 <label style="margin-top:12px;">塗布量（kg/㎡/回）</label>
 <select id="coverage"></select>
</div>

<div class="box" id="ratioBox">
<label>配合比</label>
<select id="ratio"></select>
<div class="custom-ratio-box" id="customRatioBox">
 <div class="custom-ratio-title">その他の配合比を入力</div>
 <div class="custom-ratio-row">
  <div class="custom-ratio-field">
   <label for="customRatioMain">主剤</label>
   <input id="customRatioMain" type="number" inputmode="decimal" min="0.01" step="0.1" placeholder="例：7.5">
  </div>
  <div class="custom-ratio-colon">：</div>
  <div class="custom-ratio-field">
   <label for="customRatioHard">硬化剤</label>
   <input id="customRatioHard" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例：1">
  </div>
 </div>
 <div class="custom-ratio-note">主剤と硬化剤の比率をそれぞれ入力してください。</div>
</div>
</div>

<div class="box" id="baseBox">
<label style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
<span>主剤重量（kg）</span>
<span id="showActualBtn" onclick="showActualField()" style="font-size:14px;color:#0066cc;text-decoration:underline;cursor:pointer;font-weight:normal;">※多く入ったらこちらから修正</span>
</label>
<select id="base"></select>
</div>

<div class="box alert" id="actualBox">
<label style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
<span>実測主剤重量（kg）</span>
<button type="button" class="modal-close" onclick="hideActualField()">閉じる</button>
</label>
<div class="note">
実際に入った数値を入力
</div>
<select id="actual"></select>
</div>

<div class="box">
<label>希釈率（％）</label>
<select id="thinner"></select>
</div>

<button onclick="calc()">
▶ 配合計算
</button>

<div id="result" class="result" tabindex="-1"></div>

<div class="footer" id="footerInfo"></div>

<div class="modal" id="historyModal" onclick="closeHistoryModal(event)">
 <div class="modal-panel" onclick="event.stopPropagation()">
  <div class="modal-header">
   <div class="modal-title">履歴</div>
   <button class="modal-close" onclick="closeHistoryModal()">閉じる</button>
  </div>
  <div class="modal-body">
   <div class="history-guide">
    <div class="note">タップすると、その内容を復元します。</div>
    <div class="history-count" id="historyCount"></div>
   </div>
   <div class="history-list" id="historyList"></div>
   <button class="modal-clearall" onclick="clearAllHistory()">履歴をすべて削除</button>
  </div>
 </div>
</div>

function getNearestWbgtPoint(latitude, longitude){
 let nearestPoint = null;
 let shortestDistance = Infinity;
 const toRadians = value => value * Math.PI / 180;

 WBGT_POINTS.forEach(point => {
  const latitudeDifference = toRadians(point[2] - latitude);
  const longitudeDifference = toRadians(point[3] - longitude);
  const sinLatitude = Math.sin(latitudeDifference / 2);
  const sinLongitude = Math.sin(longitudeDifference / 2);
  const distanceFactor = sinLatitude * sinLatitude +
   Math.cos(toRadians(latitude)) * Math.cos(toRadians(point[2])) * sinLongitude * sinLongitude;
  const distance = 6371 * 2 * Math.atan2(Math.sqrt(distanceFactor), Math.sqrt(1 - distanceFactor));

  if(distance < shortestDistance){
   shortestDistance = distance;
   nearestPoint = point;
  }
 });

 return nearestPoint;
}

function formatWbgtDate(date){
 const year = date.getFullYear();
 const month = String(date.getMonth() + 1).padStart(2, "0");
 const day = String(date.getDate()).padStart(2, "0");
 return `${year}${month}${day}`;
}

async function updateWbgtInfo(){
 if(!navigator.geolocation || !window.fetch){
  setWbgtInfo("暑さ指数：この端末では情報を取得できません。", "error");
  return;
 }

 navigator.geolocation.getCurrentPosition(async position => {
  const nearestPoint = getNearestWbgtPoint(position.coords.latitude, position.coords.longitude);
  if(!nearestPoint){
   setWbgtInfo("暑さ指数：近い情報提供地点を見つけられませんでした。", "error");
   return;
  }

  try{
   const dateKey = formatWbgtDate(new Date());
   const url = `${WBGT_API_URL}?data_type=0&data_type=1&location_type=1&wbgt_nos=${nearestPoint[0]}&date_from=${dateKey}000000&date_to=${dateKey}235959`;
   const response = await fetch(url);
   if(!response.ok) throw new Error("WBGT API response error");
   const data = await response.json();
   if(data.status !== "success" || !Array.isArray(data.data)) throw new Error("WBGT API data error");

   const now = new Date();
   const nowKey = `${formatWbgtDate(now)}${String(now.getHours()).padStart(2, "0")}0000`;
   const records = data.data
    .filter(item => Number.isFinite(Number(item.wbgt_WO)) && Number(item.wbgt_WO) >= 0 &&
      String(item.wbgt_date).replace(/\D/g, "") <= nowKey)
    .sort((first, second) => {
      const dateDifference = String(second.wbgt_date).localeCompare(String(first.wbgt_date));
      return dateDifference || Number(second.wbgt_class) - Number(first.wbgt_class);
    });
   const latest = records[0];
   if(!latest) throw new Error("WBGT record unavailable");

   const value = Number(latest.wbgt_WO).toFixed(1);
   const observedAt = String(latest.wbgt_date).replace(/(\d{4})\/(\d{2})\/(\d{2}) (\d{2}):.*/, "$1年$2月$3日 $4時");
   const message = `暑さ指数（WBGT）：${nearestPoint[1]} ${value}　${observedAt}の取得情報`;
   setWbgtInfo(value >= WBGT_WARNING_THRESHOLD ? `⚠ ${message}` : message, value >= WBGT_WARNING_THRESHOLD ? "warning" : "");
  }catch(error){
   setWbgtInfo("暑さ指数：情報を取得できませんでした。", "error");
  }
 }, () => {
  setWbgtInfo("暑さ指数：位置情報の許可が必要です。", "error");
 }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
}

async function updateRainAlert(){
 if(!navigator.geolocation){
  setWeatherStatus("降雨情報：この端末では位置情報を利用できません。", true);
  return;
 }
 if(!window.fetch){
  setWeatherStatus("降雨情報：この端末では天気データを取得できません。", true);
  return;
 }

 navigator.geolocation.getCurrentPosition(async position => {
  try{
   const latitude = position.coords.latitude;
   const longitude = position.coords.longitude;
   const url = "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(latitude) +
    "&longitude=" + encodeURIComponent(longitude) +
    "&hourly=precipitation_probability&forecast_days=1&timezone=auto";
   const response = await fetch(url);
   if(!response.ok) return;

   const data = await response.json();
   const times = data.hourly && data.hourly.time;
   const probabilities = data.hourly && data.hourly.precipitation_probability;
   if(!Array.isArray(times) || !Array.isArray(probabilities)) return;

   const now = new Date();
   const endTime = new Date(now.getTime() + WEATHER_FORECAST_HOURS * 60 * 60 * 1000);
   const maxProbability = probabilities.reduce((maximum, probability, index) => {
    const forecastTime = new Date(times[index]);
    if(forecastTime >= now && forecastTime <= endTime){
     return Math.max(maximum, Number(probability) || 0);
    }
    return maximum;
   }, 0);

   setWeatherStatus(`降雨情報：今後1時間の最大降水確率 ${maxProbability}％（80％以上で表示）`);

   if(maxProbability >= WEATHER_PROBABILITY_THRESHOLD){
    showWeatherAlert();
   }
  }catch(error){
   setWeatherStatus("降雨情報：天気データを取得できませんでした。", true);
  }
 }, error => {
  const reason = error && error.code === 1
   ? "位置情報の許可が必要です。"
   : error && error.code === 2
    ? "現在地を取得できませんでした。"
    : "位置情報の取得が時間切れになりました。";
  setWeatherStatus(`降雨情報：${reason}`, true);
 }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
}

function add(select, text, value = text){
 const op = document.createElement("option");
 op.text = text;
 op.value = value;
 select.add(op);
}

function formatRatioNumber(value){
 const number = Number(value);
 return Number.isFinite(number) ? String(number) : "";
}

function getItemRatioLabel(item){
 if(item && item.ratioLabel) return item.ratioLabel;
 if(item && item.ratio === "custom"){
  const mainValue = formatRatioNumber(item.customRatioMain);
  const hardValue = formatRatioNumber(item.customRatioHard);
  return mainValue !== "" && hardValue !== "" ? `${mainValue}:${hardValue}` : "その他（手入力）";
 }
 return item && item.ratio ? item.ratio : "";
}

function getCurrentRatioInfo(){
 if(ratio.value === "custom"){
  const mainValue = Number(customRatioMain.value);
  const hardValue = Number(customRatioHard.value);

  if(customRatioMain.value === "" || customRatioHard.value === ""){
   return { error: "その他の配合比（主剤・硬化剤）を入力してください" };
  }
  if(!Number.isFinite(mainValue) || !Number.isFinite(hardValue) || mainValue <= 0 || hardValue < 0){
   return { error: "配合比は、主剤を0より大きく、硬化剤を0以上で入力してください" };
  }

  return {
   value: "custom",
   label: `${formatRatioNumber(mainValue)}:${formatRatioNumber(hardValue)}`,
   mainPart: mainValue,
   hardPart: hardValue,
   customRatioMain: formatRatioNumber(mainValue),
   customRatioHard: formatRatioNumber(hardValue)
  };
 }

 const parts = ratio.value.split(":").map(Number);
 if(parts.length !== 2 || !Number.isFinite(parts[0]) || !Number.isFinite(parts[1]) || parts[0] <= 0 || parts[1] < 0){
  return { error: "配合比を選択してください" };
 }

 return {
  value: ratio.value,
  label: ratio.value,
  mainPart: parts[0],
  hardPart: parts[1],
  customRatioMain: "",
  customRatioHard: ""
 };
}

function updateCustomRatioUI(){
 const isCustom = ratio.value === "custom";
 customRatioBox.classList.toggle("open", isCustom);
 if(!isCustom){
  customRatioMain.value = "";
  customRatioHard.value = "";
 }
}

add(ratio, "", "");
add(ratio, "10:0（一液）", "10:0");
["9:1", "8:1", "7:1", "6:1", "5:1", "4:1", "3:1", "2:1", "1:1"].forEach(value => add(ratio, value, value));
add(ratio, "その他（手入力）", "custom");

add(base, "", "");
for(let i = 0.5; i <= 20; i += 0.5){
 add(base, i.toFixed(1), i.toFixed(1));
}

add(thinner, "", "");
for(let i = 0; i <= 30; i++){
 add(thinner, String(i), String(i));
}

add(paintArea, "", "");
for(let i = 1; i <= 100; i++){
 add(paintArea, `${i}㎡`, String(i));
}
for(let i = 105; i <= 500; i += 5){
 add(paintArea, `${i}㎡`, String(i));
}

add(coverage, "", "");
for(let i = 1; i <= 100; i++){
 const value = (i / 100).toFixed(2);
 add(coverage, `${value}kg/㎡/回`, value);
}

function updateActual(){
 actual.innerHTML = "";
 add(actual, "", "");

 if(base.value === "") return;

 const start = Number(base.value) + 0.1;
 for(let i = start; i <= 20.5 + 1e-9; i += 0.1){
  const value = (Math.round(i * 10) / 10).toFixed(1);
  add(actual, `${value}kg`, value);
 }
}

function showActualField(){
 actualBox.style.display = "block";
 if(showActualBtn) showActualBtn.style.display = "none";
}

function hideActualField(){
 actual.value = "";
 actualBox.style.display = "none";
 if(showActualBtn) showActualBtn.style.display = "inline";
}

function clearResult(){
 result.innerHTML = "";
}

function smoothScrollTo(element, block = "start"){
 if(!element) return;
 window.requestAnimationFrame(() => {
  element.scrollIntoView({ behavior: "smooth", block });
 });
}

ratio.addEventListener("change", () => {
 updateCustomRatioUI();
 clearResult();
 smoothScrollTo(calculationMode === "area" ? thinner.parentNode : baseBox, "start");
});
customRatioMain.addEventListener("input", clearResult);
customRatioHard.addEventListener("input", clearResult);
base.addEventListener("change", () => {
 updateActual();
 clearResult();
 smoothScrollTo(thinner.parentNode, "start");
});
paintArea.addEventListener("change", () => { updateNeededTotal(); clearResult(); smoothScrollTo(coverage.parentNode, "start"); });
coverage.addEventListener("change", () => { updateNeededTotal(); clearResult(); smoothScrollTo(ratioBox, "start"); });
actual.addEventListener("change", clearResult);
thinner.addEventListener("change", () => {
 updateThinnerUI();
 clearResult();
});

function updateThinnerUI(){
 let note = document.getElementById("thinNote");
 if(!note){
  note = document.createElement("div");
  note.id = "thinNote";
  note.className = "thin-note";
  thinner.parentNode.appendChild(note);
 }

 const value = Number(thinner.value);
 thinner.style.color = "black";
 note.textContent = "";
 if(thinner.value === "") return;

 if(value <= 13){
  // 標準範囲
 }else if(value <= 20){
  thinner.style.color = "#cc7a00";
  note.style.color = "#cc7a00";
  note.textContent = "※メーカー推奨値を確認してください。";
 }else{
  thinner.style.color = "red";
  note.style.color = "red";
  note.textContent = "⚠ 高希釈です。仕様をご確認ください。";
 }
}

function getHistory(){
 try{
  const raw = localStorage.getItem(STORAGE_HISTORY);
  const arr = raw ? JSON.parse(raw) : [];
  return Array.isArray(arr) ? arr.slice(0, HISTORY_MAX) : [];
 }catch(error){
  return [];
 }
}

function setHistory(arr){
 localStorage.setItem(STORAGE_HISTORY, JSON.stringify(arr.slice(0, HISTORY_MAX)));
}

function getLastData(){
 try{
  const raw = localStorage.getItem(STORAGE_LAST);
  return raw ? JSON.parse(raw) : null;
 }catch(error){
  return null;
 }
}

function setLastData(data){
 localStorage.setItem(STORAGE_LAST, JSON.stringify(data));
}

function renderLatestBox(data){
 if(!data){
  historyBox.innerHTML = "前回データなし";
  return;
 }

 const mainLabel = data.mode === "area"
  ? `面積：${data.paintArea}㎡　塗布量：${data.coverage}kg/㎡/回<br>今回必要量：${data.finishedTotal}kg`
  : data.usedActual && data.actualValue
  ? `実測主剤重量：${data.actualValue}kg`
  : `主剤重量：${data.base}kg`;

 historyBox.innerHTML =
  "前回使用：<br>" +
  `${data.date || ""}<br><br>` +
  `配合比：${getItemRatioLabel(data)}<br>` +
  `${mainLabel}<br>` +
  `希釈率：${data.thinner}％`;
}

function renderHistoryCount(count){
 historyCount.textContent = `履歴は最新${HISTORY_MAX}件まで保存されます。（現在${count}/${HISTORY_MAX}件）`;
}

function saveData(ratioInfo){
 const usedActual = actualBox.style.display === "block" && actual.value !== "";
 const usedMain = usedActual ? actual.value : base.value;
 const data = {
  id: Date.now(),
  date: new Date().toLocaleString("ja-JP"),
  ratio: ratioInfo.value,
  ratioLabel: ratioInfo.label,
  customRatioMain: ratioInfo.customRatioMain,
  customRatioHard: ratioInfo.customRatioHard,
  base: base.value,
  actualValue: usedActual ? actual.value : "",
  usedActual,
  usedMain,
  thinner: thinner.value,
  mode: calculationMode,
  paintArea: calculationMode === "area" ? paintArea.value : "",
  coverage: calculationMode === "area" ? coverage.value : "",
  finishedTotal: calculationMode === "area" ? (Number(paintArea.value) * Number(coverage.value)).toFixed(2) : ""
 };

 const arr = getHistory();
 arr.unshift(data);
 setHistory(arr);
 setLastData(data);
 renderLatestBox(data);
 renderHistoryList();
}

function applyDataToForm(item, restoreMode = true){
 setMode(restoreMode && item.mode === "area" ? "area" : "normal");
 ratio.value = item.ratio || "";

 if(item.ratio === "custom"){
  customRatioMain.value = item.customRatioMain || "";
  customRatioHard.value = item.customRatioHard || "";
 }else{
  customRatioMain.value = "";
  customRatioHard.value = "";
 }
 updateCustomRatioUI();

 base.value = item.base || "";
 updateActual();
 thinner.value = item.thinner ?? "";
 if(item.mode === "area"){
  paintArea.value = item.paintArea || "";
  coverage.value = item.coverage || "";
  updateNeededTotal();
 }
 updateThinnerUI();

 if(item.usedActual && item.actualValue){
  actualBox.style.display = "block";
  if(showActualBtn) showActualBtn.style.display = "none";
  actual.value = item.actualValue;
 }else{
  actual.value = "";
  actualBox.style.display = "none";
  if(showActualBtn) showActualBtn.style.display = "inline";
 }
}

function loadData(){
 const last = getLastData();
 if(!last){
  updateActual();
  updateCustomRatioUI();
  renderLatestBox(null);
  renderHistoryList();
  return;
 }

 applyDataToForm(last, false);
 renderLatestBox(last);
 renderHistoryList();
}

function calc(){
 if(ratio.value === "" || thinner.value === "" || (calculationMode === "normal" && base.value === "")){
  alert(calculationMode === "area" ? "配合比・希釈率を選択してください" : "配合比・主剤重量・希釈率を選択してください");
  return;
 }

 const ratioInfo = getCurrentRatioInfo();
 if(ratioInfo.error){
  alert(ratioInfo.error);
  return;
 }

 const finishedTotal = Number(paintArea.value) * Number(coverage.value);
 if(calculationMode === "area" && (!Number.isFinite(finishedTotal) || finishedTotal <= 0)){
  alert("塗装面積と塗布量を入力してください");
  return;
 }
 const main = calculationMode === "area"
  ? finishedTotal / (1 + Number(thinner.value) / 100) * ratioInfo.mainPart / (ratioInfo.mainPart + ratioInfo.hardPart)
  : actualBox.style.display === "block" && actual.value !== ""
  ? Number(actual.value)
  : Number(base.value);

 const hard = main * ratioInfo.hardPart / ratioInfo.mainPart;
 const mix = main + hard;
 const thin = mix * Number(thinner.value) / 100;
 const total = mix + thin;
 const hasThin = Number(thinner.value) > 0;
 const hasHardener = Math.abs(hard) > 1e-12;

 if(!hasHardener){
  result.innerHTML =
   `<div class="step">主剤（${ratioInfo.label}）ここまで入れる<div class="value">${main.toFixed(2)}kg</div></div>` +
   (hasThin
    ? `<div class="step">希釈剤（${thinner.value}％） ${thin.toFixed(2)}kg 入れる<div class="value">${total.toFixed(2)}kg</div></div>`
    : "");
 }else{
  result.innerHTML =
   `<div class="step">主剤（${ratioInfo.label}）ここまで入れる<div class="value">${main.toFixed(2)}kg</div></div>` +
   `<div class="step">硬化剤 ${hard.toFixed(2)}kg 入れる<div class="value">${mix.toFixed(2)}kg</div></div>` +
   (hasThin
    ? `<div class="step">希釈剤（${thinner.value}％） ${thin.toFixed(2)}kg 入れる<div class="value">${total.toFixed(2)}kg</div></div>`
    : "");
 }

 saveData(ratioInfo);

 actual.value = "";
 actualBox.style.display = "none";
 if(showActualBtn) showActualBtn.style.display = "inline";

 smoothScrollTo(result, "start");
}

function openHistoryModal(){
 renderHistoryList();
 historyModal.classList.add("open");
 document.body.style.overflow = "hidden";
}

function closeHistoryModal(event){
 if(event && event.target !== historyModal) return;
 historyModal.classList.remove("open");
 document.body.style.overflow = "";
}

function restoreHistoryItem(itemId){
 const arr = getHistory();
 const item = arr.find(entry => String(entry.id) === String(itemId));
 if(!item) return;

 applyDataToForm(item);
 clearResult();
 closeHistoryModal();
 renderLatestBox(item);
 setLastData(item);
 setTimeout(() => smoothScrollTo(ratioBox, "start"), 50);
}

function deleteHistoryItem(itemId){
 const arr = getHistory().filter(entry => String(entry.id) !== String(itemId));
 setHistory(arr);

 const last = arr[0] || null;
 if(last){
  setLastData(last);
  renderLatestBox(last);
 }else{
  localStorage.removeItem(STORAGE_LAST);
  renderLatestBox(null);
 }

 renderHistoryList();
}

function clearAllHistory(){
 if(!confirm("履歴をすべて削除しますか？")) return;
 localStorage.removeItem(STORAGE_HISTORY);
 localStorage.removeItem(STORAGE_LAST);
 renderLatestBox(null);
 renderHistoryList();
 closeHistoryModal();
}

function renderHistoryList(){
 const arr = getHistory();
 historyList.innerHTML = "";
 renderHistoryCount(arr.length);

 if(arr.length === 0){
  historyList.innerHTML = '<div class="modal-empty">履歴はまだありません。</div>';
  return;
 }

 arr.forEach(item => {
  const div = document.createElement("div");
  div.className = "history-item";

  const mainLabel = item.mode === "area"
   ? `面積：${item.paintArea}㎡<br>塗布量：${item.coverage}kg/㎡/回<br>今回必要量：${item.finishedTotal}kg`
   : item.usedActual && item.actualValue
   ? `実測主剤重量：${item.actualValue}kg`
   : `主剤重量：${item.base}kg`;

  div.innerHTML = `
   <div class="history-main" data-id="${item.id}">
    <div class="history-date">${item.date || ""}</div>
    <div class="history-text">
     配合比：${getItemRatioLabel(item)}<br>
     ${mainLabel}<br>
     希釈率：${item.thinner}％
    </div>
   </div>
   <div class="history-actions">
    <button class="history-restore" data-restore="${item.id}">復元</button>
    <button class="history-delete" data-delete="${item.id}">削除</button>
   </div>
  `;
  historyList.appendChild(div);
 });

 historyList.querySelectorAll("[data-restore]").forEach(button => {
  button.addEventListener("click", event => {
   event.stopPropagation();
   restoreHistoryItem(button.getAttribute("data-restore"));
  });
 });

 historyList.querySelectorAll("[data-delete]").forEach(button => {
  button.addEventListener("click", event => {
   event.stopPropagation();
   deleteHistoryItem(button.getAttribute("data-delete"));
  });
 });

 historyList.querySelectorAll("[data-id]").forEach(box => {
  box.addEventListener("click", () => {
   restoreHistoryItem(box.getAttribute("data-id"));
  });
 });
}

document.addEventListener("keydown", event => {
 if(event.key === "Escape" && historyModal.classList.contains("open")){
  closeHistoryModal();
 }
});

initializeAppInfo();
updateThinnerUI();
setMode("normal");
loadData();
updateRainAlert();
updateWbgtInfo();
</script>
