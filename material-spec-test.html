<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塗料配合計算</title>

<style>
*{box-sizing:border-box;}

html{
 scroll-behavior:smooth;
}

body{
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 margin:0;
 padding:12px 12px 88px;
 font-size:18px;
 min-height:100vh;
 background:
  radial-gradient(140px 95px at 10% 12%, rgba(255,72,72,0.16) 0%, rgba(255,72,72,0.11) 18%, rgba(255,72,72,0.00) 62%),
  radial-gradient(160px 120px at 88% 16%, rgba(255,159,28,0.14) 0%, rgba(255,159,28,0.09) 18%, rgba(255,159,28,0.00) 65%),
  radial-gradient(170px 130px at 18% 42%, rgba(255,235,59,0.13) 0%, rgba(255,235,59,0.08) 18%, rgba(255,235,59,0.00) 66%),
  radial-gradient(180px 140px at 82% 40%, rgba(76,175,80,0.12) 0%, rgba(76,175,80,0.08) 18%, rgba(76,175,80,0.00) 66%),
  radial-gradient(170px 130px at 38% 76%, rgba(0,188,212,0.13) 0%, rgba(0,188,212,0.08) 18%, rgba(0,188,212,0.00) 66%),
  radial-gradient(160px 120px at 92% 78%, rgba(63,81,181,0.12) 0%, rgba(63,81,181,0.08) 18%, rgba(63,81,181,0.00) 66%),
  radial-gradient(140px 100px at 58% 22%, rgba(156,39,176,0.10) 0%, rgba(156,39,176,0.06) 18%, rgba(156,39,176,0.00) 68%),
  radial-gradient(150px 110px at 68% 66%, rgba(255,105,180,0.10) 0%, rgba(255,105,180,0.06) 18%, rgba(255,105,180,0.00) 68%),
  linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.94));
 background-attachment: fixed;
}

h1{
 text-align:center;
 font-size:26px;
 margin: 8px 0 10px;
}

.header{
 background:#2d6cdf;
 color:white;
 font-size:22px;
 font-weight:bold;
 text-align:center;
 padding:14px;
 border-radius:10px;
}

.weather-alert{
 background:#fff1f0;
 border:1px solid #eea9a2;
 color:#b42318;
 margin-top:12px;
 padding:11px 12px;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 line-height:1.45;
 white-space:pre-line;
}

.weather-status{
 margin-top:8px;
 color:#5b6472;
 font-size:13px;
 line-height:1.45;
 text-align:center;
}
.weather-status.error{
 color:#b42318;
}

.weather-refresh{
 display:block;
 width:auto;
 margin:7px auto 0;
 padding:7px 12px;
 background:#7898bc;
 font-size:13px;
 border-radius:8px;
}
.weather-refresh:disabled{
 opacity:.65;
 cursor:default;
}

.wbgt-info{
 margin-top:8px;
 padding:10px 12px;
 border:1px solid #b7c5d7;
 border-radius:10px;
 background:#f4f8fc;
 color:#334155;
 font-size:14px;
 line-height:1.5;
}
.wbgt-info.warning{
 border-color:#d83a34;
 background:#fff1f0;
 color:#c62828;
 font-weight:bold;
}
.wbgt-info.error{
 border-color:#e4a09a;
 background:#fff5f3;
 color:#b42318;
}

.box{
 background:#eaf3ff;
 margin-top:12px;
 padding:12px;
 border-radius:10px;
}

.alert{
 background:#fff3e0;
 border:2px solid #ff9800;
}

.info{
 background:#e8f5e9;
 border:2px solid #4caf50;
 font-size:16px;
}

.history-inline{
 display:flex;
 flex-direction:column;
 gap:10px;
 margin-top:12px;
 padding:10px 12px;
}

.history-inline-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.history-inline-label{
 flex:1 1 auto;
 min-width:0;
 font-weight:bold;
 font-size:15px;
 color:#1f2937;
 white-space:nowrap;
}

.history-inline-value{
 font-size:14px;
 line-height:1.45;
 color:#111827;
 word-break:break-word;
}

label{
 display:block;
 font-weight:bold;
 font-size:20px;
}

[hidden]{
 display:none !important;
}

.field-label-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
}

.maker-site-link{
 font-size:14px;
 font-weight:normal;
 white-space:nowrap;
}

.note{
 color:#cc6600;
 font-size:15px;
 line-height:1.4;
}

select,input,button{
 width:100%;
 margin-top:8px;
 padding:14px;
 font-size:22px;
 border-radius:8px;
}

button{
 background:#2d6cdf;
 color:white;
 border:none;
 font-weight:bold;
 cursor:pointer;
}

button:active{
 transform: translateY(1px);
}

.header{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 align-items:center;
}
.header-title{grid-column:2;}
.voice-start{
 grid-column:3;
 width:46px;
 height:46px;
 margin:0;
 padding:0;
 justify-self:end;
 display:grid;
 place-items:center;
 background:#fff;
 border:2px solid rgba(255,255,255,.72);
 border-radius:50%;
 box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.voice-start:active{transform:scale(.96);}
.voice-start svg{width:25px;height:25px;stroke:#2d6cdf;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.voice-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.52);}
.voice-overlay.open{display:flex;}
.voice-panel{width:min(100%,520px);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,251,255,.97));border-radius:18px;overflow:hidden;box-shadow:0 18px 55px rgba(15,23,42,.35);}
.voice-panel-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:#2d6cdf;color:#fff;font-size:21px;font-weight:bold;}
.voice-close{width:auto;margin:0;padding:8px 12px;background:#6b7280;font-size:15px;}
.voice-body{padding:16px 14px 14px;}
.voice-guide{text-align:center;color:#4b5563;font-size:15px;margin:0 0 12px;}
.voice-list{display:flex;flex-direction:column;gap:10px;}
.voice-item{padding:12px;border:2px solid #bed4ee;border-radius:12px;background:#eaf3ff;}
.voice-item.active{border-color:#2d6cdf;background:#f7fbff;box-shadow:0 0 0 3px rgba(45,108,223,.12);}
.voice-item.done{border-color:#4caf50;background:#e8f5e9;}
.voice-item.error{border-color:#d97706;background:#fff7ed;}
.voice-item-top{display:flex;justify-content:space-between;gap:10px;align-items:center;}
.voice-item-label{font-size:18px;font-weight:bold;color:#1f2937;}
.voice-item-state{font-size:14px;color:#4b5563;font-weight:bold;white-space:nowrap;}
.voice-item-value{min-height:28px;margin-top:6px;color:#52606f;font-size:20px;font-weight:bold;}
.voice-listening-dots{display:inline-flex;gap:3px;margin-left:5px;vertical-align:middle;}
.voice-listening-dots i{display:block;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25;animation:voice-dot-pulse 1.05s infinite ease-in-out;}
.voice-listening-dots i:nth-child(2){animation-delay:.16s;}.voice-listening-dots i:nth-child(3){animation-delay:.32s;}
@keyframes voice-dot-pulse{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.voice-status{min-height:22px;margin-top:12px;text-align:center;color:#4b5563;font-size:15px;}
.voice-tools{display:flex;gap:10px;margin-top:12px;}.voice-tools button{margin:0;font-size:18px;padding:12px 8px;}.voice-repeat{background:#f59e0b;}.voice-restart{background:#64748b;}

.btn-sub{
 background:#ff9800;
 font-size:18px;
 margin-top:12px;
 padding:10px;
}

.btn-gray{
 background:#6b7280;
 font-size:18px;
}

.result{
 background:#f5f5f5;
 margin-top:18px;
 padding:15px 15px 72px;
 border-radius:10px;
 min-height:30px;
 position:relative;
}

.result-scroll-top{
 position:absolute;
 right:14px;
 bottom:13px;
 width:46px;
 height:46px;
 margin:0;
 padding:0;
 border-radius:50%;
 background:#2d6cdf;
 color:#fff;
 font-size:28px;
 line-height:1;
 box-shadow:0 2px 7px rgba(0,0,0,.20);
}

.step{
 text-align:center;
 margin-bottom:18px;
}

.value{
 color:#d96c2f;
 font-size:36px;
 font-weight:bold;
}

#actualBox {
 display: none;
}
.thin-note{
 margin-top:8px;
 font-size:15px;
 font-weight:bold;
}

.footer{
 text-align:center;
 color:#666;
 font-size:15px;
 line-height:1.5;
 margin-top:22px;
 padding:10px 0 0;
 letter-spacing:0.04em;
}

.history-btn{
 margin-top:0;
 background:#16a34a;
 width:auto;
 min-width:72px;
 padding:10px 12px;
 font-size:16px;
 white-space:nowrap;
 flex:0 0 auto;
}

.history-list{
 display:flex;
 flex-direction:column;
 gap:10px;
 margin-top:12px;
}

.history-item{
 background:#eaf3ff;
 border:none;
 border-radius:10px;
 padding:12px;
 display:flex;
 align-items:stretch;
 gap:10px;
}

.history-main{
 flex:1;
 min-width:0;
 cursor:pointer;
 -webkit-tap-highlight-color: transparent;
}

.history-date{
 font-size:15px;
 color:#555;
 margin-bottom:6px;
}

.history-text{
 font-size:16px;
 line-height:1.55;
 color:#222;
 word-break:break-word;
}

.history-actions{
 display:flex;
 flex-direction:column;
 gap:8px;
 width:76px;
 flex:0 0 76px;
}

.history-actions button{
 width:100%;
 margin-top:0;
 padding:8px 6px;
 font-size:13px;
 border-radius:10px;
 min-height:38px;
}

.history-restore{
 background:#7898bc;
}

.history-delete{
 background:#c58f84;
}


.custom-ratio-box{
 display:none;
 margin-top:12px;
 padding:12px;
 background:rgba(255,255,255,0.72);
 border:1px solid #bfd4ef;
 border-radius:10px;
}

.custom-ratio-box.open{
 display:block;
}

.custom-ratio-title{
 font-size:16px;
 font-weight:bold;
 color:#1f2937;
 margin-bottom:8px;
}

.custom-ratio-row{
 display:grid;
 grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
 align-items:end;
 gap:10px;
}

.custom-ratio-field label{
 font-size:14px;
 margin-bottom:4px;
}

.custom-ratio-field input{
 width:100%;
 margin-top:0;
 padding:12px 10px;
 font-size:20px;
 border:1px solid #9bb7d7;
 background:#fff;
}

.custom-ratio-colon{
 font-size:28px;
 font-weight:bold;
 line-height:48px;
 color:#374151;
}

.custom-ratio-note{
 margin-top:8px;
 color:#555;
 font-size:13px;
 line-height:1.45;
}

.history-guide{
 margin-top:12px;
 padding:12px;
 background:#e8f5e9;
 border:2px solid #4caf50;
 border-radius:10px;
}

.history-count{
 margin-top:8px;
 color:#1f2937;
 font-size:14px;
 line-height:1.45;
 font-weight:normal;
}

@media (max-width: 420px){
 .history-btn{
  min-width:58px;
  padding:9px 8px;
  font-size:14px;
 }
 .history-actions{
  width:64px;
  flex-basis:64px;
 }
 .history-actions button{
  font-size:12px;
  padding:7px 4px;
 }
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.45);
 display:none;
 align-items:flex-end;
 justify-content:center;
 z-index:999;
 padding:12px;
 box-sizing:border-box;
 overflow:hidden;
}

.modal.open{
 display:flex;
}

.modal-panel{
 width:min(100%, 720px);
 max-width:720px;
 max-height:calc(100dvh - 24px);
 padding:12px;
 box-sizing:border-box;
 overflow:hidden;
 border-radius:18px 18px 12px 12px;
 overflow:hidden;
 box-shadow:0 10px 35px rgba(0,0,0,0.22);
 display:flex;
 flex-direction:column;
 background:
  radial-gradient(140px 95px at 10% 12%, rgba(255,72,72,0.16) 0%, rgba(255,72,72,0.11) 18%, rgba(255,72,72,0.00) 62%),
  radial-gradient(160px 120px at 88% 16%, rgba(255,159,28,0.14) 0%, rgba(255,159,28,0.09) 18%, rgba(255,159,28,0.00) 65%),
  radial-gradient(170px 130px at 18% 42%, rgba(255,235,59,0.13) 0%, rgba(255,235,59,0.08) 18%, rgba(255,235,59,0.00) 66%),
  radial-gradient(180px 140px at 82% 40%, rgba(76,175,80,0.12) 0%, rgba(76,175,80,0.08) 18%, rgba(76,175,80,0.00) 66%),
  radial-gradient(170px 130px at 38% 76%, rgba(0,188,212,0.13) 0%, rgba(0,188,212,0.08) 18%, rgba(0,188,212,0.00) 66%),
  radial-gradient(160px 120px at 92% 78%, rgba(63,81,181,0.12) 0%, rgba(63,81,181,0.08) 18%, rgba(63,81,181,0.00) 66%),
  radial-gradient(140px 100px at 58% 22%, rgba(156,39,176,0.10) 0%, rgba(156,39,176,0.06) 18%, rgba(156,39,176,0.00) 68%),
  radial-gradient(150px 110px at 68% 66%, rgba(255,105,180,0.10) 0%, rgba(255,105,180,0.06) 18%, rgba(255,105,180,0.00) 68%),
  linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.94));
}

.modal-panel,.modal-header,.modal-body,.material-form,.material-form label,.material-form .two-columns{
 min-width:0;
 max-width:100%;
}

.modal-header{
 background:#7898bc;
 color:white;
 padding:14px;
 border:none;
 border-radius:10px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
}

.modal-title{min-width:0;overflow-wrap:anywhere;}

.modal-title{
 font-size:22px;
 font-weight:bold;
}

.modal-close{
 width:auto;
 margin:0;
 padding:10px 12px;
 font-size:16px;
 color:#1d4ed8;
 background:white;
 border:1px solid #dbeafe;
 border-radius:10px;
}

.modal-body{
 padding:0 2px 2px;
 overflow:auto;
 min-width:0;
 overflow-x:hidden;
}

.modal-tools{
 display:flex;
 gap:10px;
 margin-top:12px;
}

.modal-tools button{
 margin-top:0;
 padding:12px 10px;
 font-size:16px;
 border-radius:10px;
}

.modal-clearall{
 background:#c58f84;
}

.modal-empty{
 padding:18px 10px;
 color:#666;
 text-align:center;
 font-size:16px;
}

.mode-switch{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.mode-switch button{
 margin-top:0;
 background:#7898bc;
 font-size:18px;
 padding:12px 8px;
}
.mode-switch button.active{background:#2d6cdf;}
.area-only{display:none;}
.area-only.open{display:block;}
.area-guide{
 margin-top:10px;
 padding:10px 12px;
 background:#e8f5e9;
 border:2px solid #4caf50;
 border-radius:10px;
 font-size:15px;
 line-height:1.5;
}

.material-actions{display:flex;gap:10px;align-items:center;}
.material-actions button{width:auto;margin:0;white-space:nowrap;padding:12px 14px;font-size:16px;background:#16a34a;}
.material-actions select{margin:0;min-width:0;flex:1;font-size:17px;padding:12px;}
.material-summary{margin-top:10px;padding:10px 12px;border:1px solid #b7c5d7;border-radius:10px;background:#f4f8fc;color:#334155;font-size:14px;line-height:1.5;}
.material-summary.empty{color:#5b6472;}
.material-form{display:grid;gap:10px;margin-top:12px;}
.material-form label{font-size:15px;}
.material-form input,.material-form select,.material-form textarea{margin-top:5px;width:100%;padding:11px;font-size:17px;border:1px solid #9bb7d7;border-radius:8px;background:#fff;font-family:inherit;}
.material-form textarea{min-height:68px;resize:vertical;}
.rate-range{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;margin-top:5px;}
.rate-range input{margin-top:0;min-width:0;}
.material-form .two-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.material-form .form-note{font-size:13px;line-height:1.45;color:#5b6472;}
.material-save{background:#16a34a;}
.material-cancel{background:#6b7280;}
.material-save-notice{margin-top:10px;padding:11px 12px;border:2px solid #4caf50;border-radius:10px;background:#e8f5e9;color:#166534;font-size:15px;font-weight:bold;line-height:1.45;}
.material-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.material-item{padding:12px;border-radius:10px;background:#eaf3ff;}
.material-item-title{font-size:17px;font-weight:bold;color:#1f2937;}
.material-item-detail{margin-top:5px;font-size:14px;line-height:1.5;color:#334155;}
.material-item-actions{display:flex;gap:8px;margin-top:10px;}
.material-item-actions button{margin:0;padding:9px 11px;width:auto;font-size:14px;}
.material-delete{background:#c58f84;}

@media (max-width: 420px){
 .modal{padding:8px;}
 .modal-panel{max-height:calc(100dvh - 16px);padding:8px;}
 .modal-header{padding:11px;gap:8px;}
 .modal-title{font-size:19px;}
 .modal-close{padding:8px 10px;font-size:14px;}
 .material-form .two-columns{grid-template-columns:1fr;gap:10px;}
 .material-form input,.material-form select,.material-form textarea{box-sizing:border-box;min-width:0;}
 .modal-tools{flex-direction:column;}
 .modal-tools button{width:100%;}
}

</style>
</head>

<body>

<h1 id="appTitle">塗料配合計算　材料仕様試作版</h1>

<div class="header">
 <span class="header-title">配合設定</span>
 <button class="voice-start" type="button" onclick="openVoiceInput()" aria-label="音声入力" title="音声入力"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path><path d="M8 21h8"></path></svg></button>
</div>

<div class="weather-alert" id="weatherAlert" hidden role="status"></div>
<div class="weather-status" id="weatherStatus" hidden></div>
<button class="weather-refresh" id="weatherRefreshBtn" type="button">安全情報を更新</button>

<div class="box info history-inline">
 <div class="history-inline-top">
  <div class="history-inline-label">前回使用</div>
  <button class="history-btn" onclick="openHistoryModal()">履歴</button>
 </div>
 <div class="history-inline-value" id="history">前回データなし</div>
</div>

<div class="box">
 <div class="mode-switch">
  <button type="button" class="active" id="normalModeBtn">通常の配合</button>
  <button type="button" id="areaModeBtn">面積から計算</button>
  <button type="button" id="totalModeBtn">完成量から計算</button>
 </div>
 <div class="area-guide" id="normalGuide">主剤重量から硬化剤・希釈剤を計算します。</div>
</div>

<div class="box">
 <label>登録済み材料</label>
 <div class="material-actions">
  <select id="materialSelect" aria-label="登録済み材料"><option value="">材料を選択</option></select>
  <button type="button" onclick="openMaterialModal()">材料仕様</button>
 </div>
 <div class="material-summary empty" id="materialSummary">材料を選ぶと、登録済みの配合比・標準希釈率・塗布量を入力欄へ反映します。</div>
</div>

<div class="box area-only" id="areaBox">
 <label>塗装面積（㎡）</label>
 <select id="paintArea"></select>
 <label style="margin-top:12px;">塗布量（kg/㎡/回）</label>
 <select id="coverage"></select>
</div>

<div class="box area-only" id="totalBox">
 <label>作りたい完成量（kg）</label>
 <select id="targetTotal"></select>
</div>

<div class="modal" id="materialModal" onclick="closeMaterialModal(event)">
 <div class="modal-panel" onclick="event.stopPropagation()">
  <div class="modal-header">
   <div class="modal-title">材料仕様</div>
   <button class="modal-close" onclick="closeMaterialModal()">閉じる</button>
  </div>
  <div class="modal-body">
   <div class="material-form">
    <div class="form-note">計算に使う仕様だけを端末内に保存します。未登録材料の数値は表示しません。</div>
    <label>メーカー
     <select id="materialMakerChoice">
      <option value="">選択してください</option>
      <option value="日本ペイント">日本ペイント</option>
      <option value="関西ペイント">関西ペイント</option>
      <option value="エスケー化研">エスケー化研</option>
      <option value="菊水化学工業">菊水化学工業</option>
      <option value="水谷ペイント">水谷ペイント</option>
      <option value="ロックペイント">ロックペイント</option>
      <option value="その他">その他（手入力）</option>
     </select>
     <input id="materialMakerOther" type="text" maxlength="80" placeholder="メーカー名を入力" hidden>
    </label>
    <label>製品名
     <select id="materialProductChoice"><option value="">メーカーを先に選択してください</option></select>
     <input id="materialProductOther" type="text" maxlength="100" placeholder="製品名を入力" hidden>

async function updateWeatherAlerts(position){
 try{
  const { latitude, longitude } = position.coords;
  const url = new URL("https://api.open-meteo.com/v1/forecast");
  url.search = new URLSearchParams({
   latitude: latitude.toFixed(4),
   longitude: longitude.toFixed(4),
   hourly: "precipitation_probability,precipitation",
   forecast_days: "2",
   timezone: "Asia/Tokyo"
  });
  const response = await fetch(url);
  if(!response.ok) throw new Error("forecast request failed");
  const data = await response.json();
  const hourly = data.hourly;
  if(!hourly?.time?.length) throw new Error("forecast data unavailable");

  const now = Date.now();
  const withinOneHour = hourly.time.reduce((items, time, index) => {
   const forecastTime = new Date(`${time}:00+09:00`).getTime();
   if(forecastTime >= now - 30 * 60 * 1000 && forecastTime <= now + 60 * 60 * 1000){
    items.push({ probability: Number(hourly.precipitation_probability[index]) || 0, precipitation: Number(hourly.precipitation[index]) || 0 });
   }
   return items;
  }, []);
  const probability = Math.max(0, ...withinOneHour.map(item => item.probability));
  const precipitation = Math.max(0, ...withinOneHour.map(item => item.precipitation));
  if(probability >= WEATHER_PROBABILITY_THRESHOLD || precipitation > 0){
   const detail = probability > 0 ? `（降水確率 ${probability}%）` : "";
   setSafetyAlert("rain", `⚠ 今後1時間以内に降雨の予報があります${detail}`);
  }else{
   setSafetyAlert("rain", "");
  }
  await updateHeatstrokeAlert(latitude, longitude);
  setWeatherStatus("");
 }catch(error){
  setWeatherStatus("安全情報を取得できませんでした。", true);
 }finally{
  setWeatherRefreshLoading(false);
 }
}

async function updateHeatstrokeAlert(latitude, longitude){
 try{
  const locationUrl = new URL("https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress");
  locationUrl.search = new URLSearchParams({ lat: latitude.toFixed(6), lon: longitude.toFixed(6) });
  const locationResponse = await fetch(locationUrl);
  if(!locationResponse.ok) throw new Error("reverse geocode failed");
  const locationData = await locationResponse.json();
  const prefectureCode = String(locationData?.results?.muniCd || "").slice(0, 2);
  const prefecture = PREFECTURE_NAMES[prefectureCode];
  if(!prefecture) throw new Error("prefecture unavailable");

  const sourceUrl = "https://r.jina.ai/http://https://www.wbgt.env.go.jp/alert.php";
  const alertResponse = await fetch(sourceUrl);
  if(!alertResponse.ok) throw new Error("heatstroke alert request failed");
  const text = await alertResponse.text();
  const row = text.split("\n").find(line => line.startsWith(`| ${prefecture} |`));
  if(!row) throw new Error("prefecture row unavailable");
  const cells = row.split("|").map(cell => cell.trim());
  const specialAlert = cells[2] === "●";
  const heatAlert = cells[3] === "●";
  if(specialAlert){
   setSafetyAlert("heat", `⚠ ${prefecture}に熱中症特別警戒アラートが発表されています`);
  }else if(heatAlert){
   setSafetyAlert("heat", `⚠ ${prefecture}に熱中症警戒アラートが発表されています`);
  }else{
   setSafetyAlert("heat", "");
  }
 }catch(error){
  setSafetyAlert("heat", "");
 }
}

   return { error: "配合比は、主剤を0より大きく、硬化剤を0以上で入力してください" };
  }

  return {
   value: "custom",
   label: `${formatRatioNumber(mainValue)}:${formatRatioNumber(hardValue)}`,
   mainPart: mainValue,
   hardPart: hardValue,
   customRatioMain: formatRatioNumber(mainValue),
   customRatioHard: formatRatioNumber(hardValue)
  };
 }

 const parts = ratio.value.split(":").map(Number);
 if(parts.length !== 2 || !Number.isFinite(parts[0]) || !Number.isFinite(parts[1]) || parts[0] <= 0 || parts[1] < 0){
  return { error: "配合比を選択してください" };
 }

 return {
  value: ratio.value,
  label: ratio.value,
  mainPart: parts[0],

function normalizeMaterialRatio(value){
 const text = String(value || "").trim().replace(/[：]/g, ":").replace(/\s/g, "");
 const match = text.match(/^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/);
 if(!match) return "";
 const mainPart = Number(match[1]);
 const hardPart = Number(match[2]);
 if(!Number.isFinite(mainPart) || !Number.isFinite(hardPart) || mainPart <= 0 || hardPart < 0) return "";
 return `${formatRatioNumber(mainPart)}:${formatRatioNumber(hardPart)}`;
}

function normalizeMaterialLiquid(value){
 if(value === "一液") return "1液";
 if(value === "二液") return "2液";
 return value === "1液" || value === "2液" ? value : "";
}

function choiceValue(choice, other){
 return choice.value === "その他" ? other.value.trim() : choice.value;

function restoreChoice(choice, other, value){
 const isListed = Array.from(choice.options).some(option => option.value === value);
 choice.value = isListed ? value : (value ? "その他" : "");

 const legacy = item.coverage ?? "";

}

 return min === max ? min : `${min}～${max}`;
}

function materialFormData(){
 const maker = materialMakerChoice.value === "その他" ? materialMakerOther.value.trim() : materialMakerChoice.value;
 const name = materialProductChoice.value === "その他" ? materialProductOther.value.trim() : materialProductChoice.value;
 const ratioValue = materialLiquid.value === "1液" ? "10:0" : normalizeMaterialRatio(materialRatioChoice.value === "その他" ? materialRatioOther.value : materialRatioChoice.value);
 const thinnerMin = materialThinnerMin.value === "" ? "" : Number(materialThinnerMin.value);
 const thinnerMax = materialThinnerMax.value === "" ? "" : Number(materialThinnerMax.value);
 const coverageOther = materialCoverageOther.value.trim().replace(/[～〜]/g, "-");
 const coverageParts = coverageOther ? coverageOther.split("-").map(value => Number(value.trim())) : [];
 const coverageMin = materialCoverageChoice.value === "その他" ? coverageParts[0] : (materialCoverageChoice.value === "" ? "" : Number(materialCoverageChoice.value));
 const coverageMax = materialCoverageChoice.value === "その他" ? (coverageParts.length === 2 ? coverageParts[1] : coverageParts[0]) : (materialCoverageMax.value === "" ? "" : Number(materialCoverageMax.value));
 if(!maker || !name){ alert("メーカーと製品名を入力してください"); return null; }
 if(!materialLiquid.value){ alert("液数を選択してください"); return null; }
 if(materialLiquid.value === "2液" && !ratioValue){ alert("配合比を選択、または「9:1」の形で入力してください"); return null; }
 if((thinnerMin === "") !== (thinnerMax === "")){
  alert("標準希釈率は下限・上限を両方入力してください"); return null;
 }
 if(thinnerMin !== "" && (!Number.isInteger(thinnerMin) || !Number.isInteger(thinnerMax) || thinnerMin < 0 || thinnerMax < 0 || thinnerMin > 100 || thinnerMax > 100 || thinnerMin > thinnerMax)){
  alert("標準希釈率は0〜100％で、下限が上限以下になるよう入力してください"); return null;
 }
 if((coverageMin === "") !== (coverageMax === "")){
  alert("標準塗布量は下限・上限を両方入力してください"); return null;
 }
 if(coverageMin !== "" && (!Number.isFinite(coverageMin) || !Number.isFinite(coverageMax) || coverageMin <= 0 || coverageMax <= 0 || coverageMin > 1 || coverageMax > 1 || coverageMin > coverageMax)){
  alert("標準塗布量は0より大きく1以下で、下限が上限以下になるよう入力してください"); return null;
 }
 let url = materialUrl.value.trim();
 if(url && !/^https?:\/\//i.test(url)){ alert("公式資料URLは https:// から入力してください"); return null; }
 return {
  id: editingMaterialId || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
  maker, name, liquid:normalizeMaterialLiquid(materialLiquid.value), ratio:ratioValue,
  thinnerName:(materialThinnerChoice.value === "その他" ? materialThinnerOther.value : materialThinnerChoice.value).trim(), thinnerMin, thinnerMax,
  coverage:coverageMin !== "" && coverageMin === coverageMax ? coverageMin.toFixed(2) : "",
  coverageMin:coverageMin === "" ? "" : coverageMin.toFixed(2), coverageMax:coverageMax === "" ? "" : coverageMax.toFixed(2),
  potLife:materialLiquid.value === "1液" ? "" : choiceValue(materialPotLifeChoice, materialPotLifeOther), url, checked:materialChecked.value, memo:materialMemo.value.trim()
 };
}

  "前回使用：<br>" +
  `${data.date || ""}<br><br>` +
  (data.materialLabel ? `材料：${data.materialLabel}<br>` : "") +
  `配合比：${getItemRatioLabel(data)}<br>` +
  `${mainLabel}<br>` +
  `希釈率：${data.thinner}％`;
}

function renderHistoryCount(count){
 historyCount.textContent = `履歴は最新${HISTORY_MAX}件まで保存されます。（現在${count}/${HISTORY_MAX}件）`;
}

function saveData(ratioInfo){
 const usedActual = actualBox.style.display === "block" && actual.value !== "";
 const usedMain = usedActual ? actual.value : base.value;
 const data = {
  id: Date.now(),
  date: new Date().toLocaleString("ja-JP"),
  materialId: materialSelect.value || "",
  materialLabel: materialSelect.value ? materialDisplayName(getMaterials().find(item => item.id === materialSelect.value) || {}) : "",
  ratio: ratioInfo.value,
  ratioLabel: ratioInfo.label,
  customRatioMain: ratioInfo.customRatioMain,
  customRatioHard: ratioInfo.customRatioHard,
  base: base.value,
  actualValue: usedActual ? actual.value : "",
  usedActual,
  usedMain,
  thinner: thinner.value,
  mode: calculationMode,
  paintArea: calculationMode === "area" ? paintArea.value : "",
  coverage: calculationMode === "area" ? coverage.value : "",
  finishedTotal: calculationMode === "area" ? (Number(paintArea.value) * Number(coverage.value)).toFixed(2) : calculationMode === "total" ? targetTotal.value : ""
 };

 const arr = getHistory();
 arr.unshift(data);
 setHistory(arr);
 setLastData(data);
 renderLatestBox(data);
 renderHistoryList();
}

function applyDataToForm(item, restoreMode = true){
 setMode(restoreMode && item.mode === "area" ? "area" : restoreMode && item.mode === "total" ? "total" : "normal");
 ratio.value = item.ratio || "";

 if(item.ratio === "custom"){
  customRatioMain.value = item.customRatioMain || "";
  customRatioHard.value = item.customRatioHard || "";
 }else{
  customRatioMain.value = "";
  customRatioHard.value = "";
 }
 updateCustomRatioUI();

 base.value = item.base || "";
 updateActual();
 thinner.value = item.thinner ?? "";
 if(item.mode === "area"){
  paintArea.value = item.paintArea || "";
  coverage.value = item.coverage || "";
  updateNeededTotal();
 }
 if(item.mode === "total") targetTotal.value = item.finishedTotal || "";
 updateThinnerUI();
 materialSelect.value = Array.from(materialSelect.options).some(option => option.value === item.materialId) ? item.materialId : "";
 renderMaterialSummary(getMaterials().find(entry => entry.id === materialSelect.value) || null);

 if(item.usedActual && item.actualValue){
  actualBox.style.display = "block";
  if(showActualBtn) showActualBtn.style.display = "none";
  actual.value = item.actualValue;
 }else{
  actual.value = "";
  actualBox.style.display = "none";
  if(showActualBtn) showActualBtn.style.display = "inline";
 }
}

function loadData(){
 const last = getLastData();
 if(!last){
  updateActual();
  updateCustomRatioUI();
  renderLatestBox(null);
  renderHistoryList();
  return;
 }

 applyDataToForm(last, false);
 renderLatestBox(last);
 renderHistoryList();
}

function calc(){
 if(ratio.value === "" || thinner.value === "" || (calculationMode === "normal" && base.value === "") || (calculationMode === "total" && targetTotal.value === "")){
  alert(calculationMode === "area" ? "配合比・希釈率を選択してください" : calculationMode === "total" ? "作りたい完成量・配合比・希釈率を選択してください" : "配合比・主剤重量・希釈率を選択してください");
  return;
 }

 const ratioInfo = getCurrentRatioInfo();
 if(ratioInfo.error){
  alert(ratioInfo.error);
  return;
 }

 const finishedTotal = calculationMode === "area" ? Number(paintArea.value) * Number(coverage.value) : calculationMode === "total" ? Number(targetTotal.value) : 0;
 if((calculationMode === "area" || calculationMode === "total") && (!Number.isFinite(finishedTotal) || finishedTotal <= 0)){
  alert(calculationMode === "area" ? "塗装面積と塗布量を入力してください" : "作りたい完成量を入力してください");
  return;
 }
 const main = (calculationMode === "area" || calculationMode === "total")
  ? finishedTotal / (1 + Number(thinner.value) / 100) * ratioInfo.mainPart / (ratioInfo.mainPart + ratioInfo.hardPart)
  : actualBox.style.display === "block" && actual.value !== ""
  ? Number(actual.value)
  : Number(base.value);

 const hard = main * ratioInfo.hardPart / ratioInfo.mainPart;
 const mix = main + hard;
 const thin = mix * Number(thinner.value) / 100;
 const total = mix + thin;
 const hasThin = Number(thinner.value) > 0;
 const hasHardener = Math.abs(hard) > 1e-12;

 if(!hasHardener){
 result.innerHTML =
   `<div class="step">主剤（${ratioInfo.label}）ここまで入れる<div class="value">${main.toFixed(2)}kg</div></div>` +
   (hasThin
    ? `<div class="step">希釈剤（${thinner.value}％） ${thin.toFixed(2)}kg 入れる<div class="value">${total.toFixed(2)}kg</div></div>`
    : "");
 }else{
  result.innerHTML =
   `<div class="step">主剤（${ratioInfo.label}）ここまで入れる<div class="value">${main.toFixed(2)}kg</div></div>` +
   `<div class="step">硬化剤 ${hard.toFixed(2)}kg 入れる<div class="value">${mix.toFixed(2)}kg</div></div>` +
   (hasThin
    ? `<div class="step">希釈剤（${thinner.value}％） ${thin.toFixed(2)}kg 入れる<div class="value">${total.toFixed(2)}kg</div></div>`
    : "");
 }

 result.insertAdjacentHTML("beforeend", '<button type="button" class="result-scroll-top" onclick="scrollToAppTop()" aria-label="画面上部へ戻る" title="画面上部へ戻る">↑</button>');

 saveData(ratioInfo);

 actual.value = "";
 actualBox.style.display = "none";
 if(showActualBtn) showActualBtn.style.display = "inline";

 smoothScrollTo(result, "start");
}

function scrollToAppTop(){
 window.scrollTo({ top:0, behavior:"smooth" });
}

function openHistoryModal(){
 renderHistoryList();
 historyModal.classList.add("open");
 document.body.style.overflow = "hidden";
}

function closeHistoryModal(event){
 if(event && event.target !== historyModal) return;
 historyModal.classList.remove("open");
 document.body.style.overflow = "";
}

function restoreHistoryItem(itemId){
 const arr = getHistory();
 const item = arr.find(entry => String(entry.id) === String(itemId));
 if(!item) return;

 applyDataToForm(item);
 clearResult();
 closeHistoryModal();
 renderLatestBox(item);
 setLastData(item);
 setTimeout(() => smoothScrollTo(ratioBox, "start"), 50);
}

function deleteHistoryItem(itemId){
 const arr = getHistory().filter(entry => String(entry.id) !== String(itemId));
 setHistory(arr);

 const last = arr[0] || null;
 if(last){
  setLastData(last);
  renderLatestBox(last);
 }else{
  localStorage.removeItem(STORAGE_LAST);
  renderLatestBox(null);
 }

 renderHistoryList();
}

function clearAllHistory(){
 if(!confirm("履歴をすべて削除しますか？")) return;
 localStorage.removeItem(STORAGE_HISTORY);
 localStorage.removeItem(STORAGE_LAST);
 renderLatestBox(null);
 renderHistoryList();
 closeHistoryModal();
}

function renderHistoryList(){
 const arr = getHistory();
 historyList.innerHTML = "";
 renderHistoryCount(arr.length);

 if(arr.length === 0){
  historyList.innerHTML = '<div class="modal-empty">履歴はまだありません。</div>';
  return;
 }

 arr.forEach(item => {
  const div = document.createElement("div");
  div.className = "history-item";

  const mainLabel = item.mode === "area"
   ? `面積：${item.paintArea}㎡<br>塗布量：${item.coverage}kg/㎡/回<br>今回必要量：${item.finishedTotal}kg`
   : item.usedActual && item.actualValue
   ? `実測主剤重量：${item.actualValue}kg`
   : `主剤重量：${item.base}kg`;

  div.innerHTML = `
   <div class="history-main" data-id="${item.id}">
    <div class="history-date">${item.date || ""}</div>
   <div class="history-text">
     ${item.materialLabel ? `材料：${item.materialLabel}<br>` : ""}
     配合比：${getItemRatioLabel(item)}<br>
     ${mainLabel}<br>
     希釈率：${item.thinner}％
    </div>
   </div>
   <div class="history-actions">
    <button class="history-restore" data-restore="${item.id}">復元</button>
    <button class="history-delete" data-delete="${item.id}">削除</button>
   </div>
  `;
  historyList.appendChild(div);
 });

 historyList.querySelectorAll("[data-restore]").forEach(button => {
  button.addEventListener("click", event => {
   event.stopPropagation();
   restoreHistoryItem(button.getAttribute("data-restore"));
  });
 });

 historyList.querySelectorAll("[data-delete]").forEach(button => {
  button.addEventListener("click", event => {
   event.stopPropagation();
   deleteHistoryItem(button.getAttribute("data-delete"));
  });
 });

 historyList.querySelectorAll("[data-id]").forEach(box => {
  box.addEventListener("click", () => {
   restoreHistoryItem(box.getAttribute("data-id"));
  });
 });
}

// ===== 音声入力 =====
const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
const voiceOverlay = document.getElementById("voiceOverlay");
const voiceList = document.getElementById("voiceList");
const voiceGuide = document.getElementById("voiceGuide");
const voiceStatus = document.getElementById("voiceStatus");
let voiceRecognition = null;
let voiceStepIndex = 0;
let voiceIsListening = false;
let voiceRetryTimer = null;
let voiceSteps = [];

function getVoiceSteps(){
 return calculationMode === "area"
  ? [
    { key:"paintArea", label:"① 塗装面積", example:"例：30㎡" },
    { key:"coverage", label:"② 塗布量", example:"例：0.15kg/㎡/回" },
    { key:"ratio", label:"③ 配合比", example:"例：9：1" },
    { key:"thinner", label:"④ 希釈率", example:"例：10％" }
   ]
  : [
    { key:"ratio", label:"① 配合比", example:"例：9：1" },
    { key:"base", label:"② 主剤重量", example:"例：3kg" },
    { key:"thinner", label:"③ 希釈率", example:"例：10％" }
   ];
}

function normalizeVoiceText(text){
 const kanjiDigits = { "〇":"0", "零":"0", "一":"1", "二":"2", "三":"3", "四":"4", "五":"5", "六":"6", "七":"7", "八":"8", "九":"9" };
 return text.replace(/[〇零一二三四五六七八九]/g, character => kanjiDigits[character])
  .replace(/[：:]/g, "対").replace(/たい|対|to/gi, "対")
  .replace(/平方メートル|平米|㎡/gi, "").replace(/キログラム|キロ|kg/gi, "")
  .replace(/パーセント|％|%/gi, "").replace(/点/g, ".").replace(/[\s、。]/g, "");
}

function parseVoiceValue(text){
 const step = voiceSteps[voiceStepIndex];
 const normalized = normalizeVoiceText(text);
 if(!step) return null;
 if(step.key === "ratio"){
  const match = normalized.match(/(10|[1-9])対(10|[0-9])/);
  if(!match) return null;
  const value = `${match[1]}:${match[2]}`;
  return Array.from(ratio.options).some(option => option.value === value) ? value : null;
 }
 const match = normalized.match(/\d+(?:\.\d+)?/);
 if(!match) return null;
 const number = Number(match[0]);
 if(step.key === "base") return number >= .5 && number <= 20 && Math.abs(number * 2 - Math.round(number * 2)) < .001 ? number.toFixed(1) : null;
 if(step.key === "paintArea") return Number.isInteger(number) && number >= 1 && number <= 500 && Array.from(paintArea.options).some(option => option.value === String(number)) ? String(number) : null;
 if(step.key === "coverage"){
  const value = number.toFixed(2);
  return number >= .01 && number <= 1 && Array.from(coverage.options).some(option => option.value === value) ? value : null;
 }
 return Number.isInteger(number) && number >= 0 && number <= 30 ? String(number) : null;
}

function voiceDisplayValue(step, value){
 if(step.key === "ratio") return value.replace(":", "：");
 if(step.key === "paintArea") return `${value}㎡`;
 if(step.key === "coverage") return `${value}kg/㎡/回`;
 if(step.key === "base") return `${value}kg`;
 return `${value}％`;
}

function renderVoiceStep(){
 voiceList.innerHTML = voiceSteps.map((step, index) => {
  const state = index < voiceStepIndex ? "完了 ✓" : index === voiceStepIndex ? '聞き取り中<span class="voice-listening-dots" aria-hidden="true"><i></i><i></i><i></i></span>' : "未入力";
  const value = index < voiceStepIndex ? voiceDisplayValue(step, getVoiceSelect(step.key).value) : step.example;
  return `<div class="voice-item ${index === voiceStepIndex ? "active" : ""} ${index < voiceStepIndex ? "done" : ""}" data-voice-item="${index}"><div class="voice-item-top"><div class="voice-item-label">${step.label}</div><div class="voice-item-state">${state}</div></div><div class="voice-item-value">${value}</div></div>`;
 }).join("");
 voiceStatus.textContent = "マイクに向かって話してください";
}

function getVoiceSelect(key){ return ({ ratio, base, thinner, paintArea, coverage })[key]; }
function clearVoiceRetry(){ if(voiceRetryTimer) clearTimeout(voiceRetryTimer); voiceRetryTimer = null; }
function showVoiceFailure(message){
 const item = voiceList.querySelector(`[data-voice-item="${voiceStepIndex}"]`);
 if(item){ item.classList.remove("active"); item.classList.add("error"); const state = item.querySelector(".voice-item-state"); if(state) state.textContent = "確認できません"; }
 voiceStatus.textContent = message;
}
function retryVoiceStep(message){
 clearVoiceRetry(); showVoiceFailure(message);
 voiceRetryTimer = window.setTimeout(() => { if(!voiceOverlay.classList.contains("open")) return; voiceRecognition = createVoiceRecognition(); renderVoiceStep(); startVoiceListening(); }, 1200);
}
function createVoiceRecognition(){
 if(!SpeechRecognitionClass) return null;
 const recognition = new SpeechRecognitionClass();
 recognition.lang = "ja-JP"; recognition.continuous = false; recognition.interimResults = true; recognition.maxAlternatives = 1;
 recognition.onresult = event => {
  const text = Array.from(event.results).map(result => result[0].transcript).join("").trim();
  const item = voiceList.querySelector(`[data-voice-item="${voiceStepIndex}"] .voice-item-value`);
  if(text && item){
   const provisionalValue = parseVoiceValue(text);
   item.textContent = provisionalValue === null ? text : voiceDisplayValue(voiceSteps[voiceStepIndex], provisionalValue);
  }
  const finalResult = event.results[event.results.length - 1];
  if(finalResult && finalResult.isFinal) handleVoiceResult(text);
 };
 recognition.onerror = event => { voiceIsListening = false; if(event.error === "not-allowed" || event.error === "service-not-allowed") voiceStatus.textContent = "マイクの許可が必要です"; else if(event.error !== "aborted") retryVoiceStep("聞き取れませんでした。もう一度聞き取ります…"); };
 recognition.onend = () => { voiceIsListening = false; };
 return recognition;
}
function startVoiceListening(){
 if(!voiceRecognition || !voiceOverlay.classList.contains("open")) return;
 try{ voiceIsListening = true; voiceRecognition.start(); }
 catch(error){ voiceIsListening = false; voiceStatus.textContent = "音声入力を開始し直しています…"; window.setTimeout(() => { if(!voiceOverlay.classList.contains("open")) return; voiceRecognition = createVoiceRecognition(); try{ voiceIsListening = true; voiceRecognition.start(); }catch(retryError){ voiceIsListening = false; showVoiceFailure("音声入力を開始できませんでした。もう一度を押してください"); } }, 350); }
}
function stopVoiceRecognition(){
 const recognition = voiceRecognition; voiceRecognition = null; voiceIsListening = false;
 if(!recognition) return;
 try{ recognition.onresult = null; recognition.onerror = null; recognition.onend = null; recognition.abort(); }catch(error){ try{ recognition.stop(); }catch(stopError){} }
}
function advanceVoiceStep(){
 if(voiceStepIndex < voiceSteps.length - 1){ voiceStepIndex += 1; window.setTimeout(() => { if(!voiceOverlay.classList.contains("open")) return; voiceRecognition = createVoiceRecognition(); renderVoiceStep(); startVoiceListening(); }, 500); }
 else { window.setTimeout(() => { closeVoiceInput(); calc(); }, 250); }
}
function handleVoiceResult(text){
 const normalized = normalizeVoiceText(text);
 if(normalized.includes("最初から")){ restartVoiceInput(); return; }
 const value = parseVoiceValue(text);
 if(value === null){ retryVoiceStep("確認できませんでした。もう一度聞き取ります…"); return; }
 const step = voiceSteps[voiceStepIndex];
 getVoiceSelect(step.key).value = value;
 updateCustomRatioUI(); updateActual(); updateThinnerUI(); clearResult();
 const item = voiceList.querySelector(`[data-voice-item="${voiceStepIndex}"]`);
 if(item){ item.classList.remove("active"); item.classList.add("done"); item.querySelector(".voice-item-state").textContent = "完了 ✓"; item.querySelector(".voice-item-value").textContent = voiceDisplayValue(step, value); }
 voiceStatus.textContent = `はい、${voiceDisplayValue(step, value)}ですね`;
 if(voiceRecognition && voiceIsListening) try{ voiceRecognition.abort(); }catch(error){}
 voiceIsListening = false; advanceVoiceStep();
}
function openVoiceInput(){
 if(!SpeechRecognitionClass){ alert("このブラウザは音声入力に対応していません"); return; }
 closeHistoryModal(); clearVoiceRetry(); voiceSteps = getVoiceSteps(); voiceStepIndex = 0; voiceOverlay.classList.add("open"); document.body.style.overflow = "hidden"; voiceGuide.textContent = calculationMode === "area" ? "面積から計算する内容を順番に声で入力します" : "順番に声で入力します"; voiceRecognition = createVoiceRecognition(); renderVoiceStep(); startVoiceListening();
}
function closeVoiceInput(){ clearVoiceRetry(); stopVoiceRecognition(); voiceOverlay.classList.remove("open"); document.body.style.overflow = ""; }
function backVoiceStep(){
 if(!voiceOverlay.classList.contains("open")) return;
 if(voiceStepIndex === 0){ voiceStatus.textContent = "最初の項目です"; return; }
 clearVoiceRetry();
 stopVoiceRecognition();
 voiceStepIndex -= 1;
 const step = voiceSteps[voiceStepIndex];
 getVoiceSelect(step.key).value = "";
 if(step.key === "ratio") updateCustomRatioUI();
 if(step.key === "base") updateActual();
 if(step.key === "thinner") updateThinnerUI();
 clearResult();
 voiceRecognition = createVoiceRecognition();
 renderVoiceStep();
 window.setTimeout(startVoiceListening, 120);
}
function restartVoiceInput(){ if(!voiceOverlay.classList.contains("open")) return; clearVoiceRetry(); stopVoiceRecognition(); voiceStepIndex = 0; voiceRecognition = createVoiceRecognition(); renderVoiceStep(); window.setTimeout(startVoiceListening, 120); }

document.addEventListener("keydown", event => {
 if(event.key === "Escape" && historyModal.classList.contains("open")){
  closeHistoryModal();
 }
 if(event.key === "Escape" && materialModal.classList.contains("open")){
  closeMaterialModal();
 }
 if(event.key === "Escape" && voiceOverlay.classList.contains("open")){
  closeVoiceInput();
 }
});

populateCoverageMaxOptions();
initializeAppInfo();
renderMaterialSelect();
updateThinnerUI();
setMode("normal");
loadData();
setWeatherStatus("安全情報は「天気情報を更新」を押して確認します。");
</script>
