name: Cache reflection test3 version

on:
  push:
    paths:
      - '.github/workflows/cache-test3-version.yml'

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update only version metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('material-spec-test.html')
          s = p.read_text(encoding='utf-8')
          old = 'const APP_VERSION = "Ver.1.87-test2";\nconst APP_DATE = "2026/09/01";\nconst APP_TIME = "22:03";'
          new = 'const APP_VERSION = "Ver.1.87-test3";\nconst APP_DATE = "2026/09/01";\nconst APP_TIME = "22:15";'
          assert old in s, 'expected current metadata not found'
          assert s.count(old) == 1, 'metadata block not unique'
          s2 = s.replace(old, new, 1)
          p.write_text(s2, encoding='utf-8')
          PY
          rm .github/workflows/cache-test3-version.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add material-spec-test.html .github/workflows/cache-test3-version.yml
          git commit -m 'Set cache reflection test3 version'
          git push origin main
