name: One-off test12 update
on:
  push:
    paths:
      - '.github/workflows/oneoff-test12.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update exact test12 changes
        shell: python
        run: |
          from pathlib import Path
          p = Path('material-spec-test.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('const APP_VERSION = "Ver.1.87-test11";', 'const APP_VERSION = "Ver.1.87-test12";'),
              ('const APP_TIME = "21:01";', 'const APP_TIME = "21:12";'),
              (' smoothScrollTo(document.getElementById("calculateButton"), "start");\n}', ' window.setTimeout(() => {\n  smoothScrollTo(document.getElementById("calculateButton"), "start");\n }, 0);\n}')
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 match, got {count}: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add material-spec-test.html
          git commit -m "Update material-spec-test to Ver.1.87-test12"
          git push
