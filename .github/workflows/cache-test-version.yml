name: Cache reflection test2 version

on:
  push:
    paths:
      - '.github/workflows/cache-test-version.yml'

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update visible test version only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('material-spec-test.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'const APP_VERSION = "Ver.1.87-test1";': 'const APP_VERSION = "Ver.1.87-test2";',
              'const APP_DATE = "2026/09/01";': 'const APP_DATE = "2026/09/01";',
              'const APP_TIME = "21:54";': 'const APP_TIME = "22:03";',
          }
          for old, new in replacements.items():
              if old == new:
                  continue
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one match: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='')
          PY
          rm .github/workflows/cache-test-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add material-spec-test.html .github/workflows/cache-test-version.yml
          git diff --cached --check
          git commit -m "Set cache reflection test2 version"
          git push origin HEAD:main