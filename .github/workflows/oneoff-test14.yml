name: One-off test14 update
on:
  push:
    paths:
      - '.github/workflows/oneoff-test14.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact test14 changes
        shell: bash
        run: |
          echo  | base64 -d > /tmp/update_test14.py
          python /tmp/update_test14.py
          git diff --check
          git config user.name aragau
          git config user.email info_nhs_y@ybb.ne.jp
          git add material-spec-test.html
          git rm .github/workflows/oneoff-test14.yml
          git commit -m "Update material-spec-test to Ver.1.87-test14"
          git push
