name: One-off test11 update v2
on:
  push:
    paths:
      - '.github/workflows/oneoff-test11-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact test11 changes
        run: |
          echo '' | base64 -d > /tmp/update_test11.py
          python /tmp/update_test11.py
          git rm .github/workflows/oneoff-test11-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add material-spec-test.html
          git diff --check
          git commit -m 'Update material-spec-test to Ver.1.87-test11'
          git push
