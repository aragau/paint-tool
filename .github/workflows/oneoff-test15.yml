name: oneoff-test15
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oneoff-test15.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact test15 changes
        shell: python
        run: |
          from pathlib import Path
          p = Path('material-spec-test.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('const APP_VERSION = "Ver.1.87-test14";', 'const APP_VERSION = "Ver.1.87-test15";'),
            ('const APP_TIME = "21:27";', 'const APP_TIME = "21:55";'),
            ('''  const mainLabel = item.mode === "area"\n   ? `面積：${item.paintArea}㎡<br>塗布量：${item.coverage}kg/㎡/回<br>今回必要量：${item.finishedTotal}kg`\n   : item.usedActual && item.actualValue\n   ? `実測主剤重量：${item.actualValue}kg`\n   : `主剤重量：${item.base}kg`;''', '''  const mainLabel = item.mode === "area"\n   ? `面積：${item.paintArea}㎡<br>塗布量：${item.coverage}kg/㎡/回<br>今回必要量：${item.finishedTotal}kg`\n   : item.mode === "total"\n   ? `完成量：${item.finishedTotal}kg`\n   : item.usedActual && item.actualValue\n   ? `実測主剤重量：${item.actualValue}kg`\n   : `主剤重量：${item.base}kg`;''')
          ]
          for old, new in replacements:
            count = s.count(old)
            assert count == 1, f'expected 1 match, got {count}: {old[:80]}'
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add material-spec-test.html
          git commit -m "Fix total-mode history display in test15"
          git push
