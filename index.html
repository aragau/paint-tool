<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塗料配合計算 by N.H.S. Ver.14.5</title>

<style>
*{box-sizing:border-box;}

body{
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 margin:0;
 padding:12px;
 font-size:18px;
}

h1{
 text-align:center;
 font-size:26px;
}

.header{
 background:#2d6cdf;
 color:white;
 font-size:22px;
 font-weight:bold;
 text-align:center;
 padding:14px;
 border-radius:10px;
}

.box{
 background:#eaf3ff;
 margin-top:12px;
 padding:12px;
 border-radius:10px;
}

.alert{
 background:#fff3e0;
 border:2px solid #ff9800;
}

.info{
 background:#e8f5e9;
 border:2px solid #4caf50;
 font-size:16px;
}

label{
 display:block;
 font-weight:bold;
 font-size:20px;
}

.note{
 color:#cc6600;
 font-size:15px;
}

select,button{
 width:100%;
 margin-top:8px;
 padding:14px;
 font-size:22px;
 border-radius:8px;
}

button{
 background:#2d6cdf;
 color:white;
 border:none;
 font-weight:bold;
 cursor: pointer;
}

.btn-sub{
 background:#ff9800;
 font-size:18px;
 margin-top:12px;
 padding:10px;
}

.result{
 background:#f5f5f5;
 margin-top:18px;
 padding:15px;
 border-radius:10px;
 min-height:30px;
}

.step{
 text-align:center;
 margin-bottom:18px;
}

.value{
 color:#d00000;
 font-size:36px;
 font-weight:bold;
}

#actualBox {
 display: none;
}
.thin-note{margin-top:8px;font-size:15px;font-weight:bold;}
</style>
</head>

<body>

<h1>塗料配合計算 by N.H.S.</h1>

<div class="header">
配合設定
</div>

<div class="box info" id="history">
前回データなし
</div>

<div class="box">
<label>配合比</label>
<select id="ratio"></select>
</div>

<div class="box">
<label style="display:flex;justify-content:space-between;align-items:center;">
<span>主剤重量（kg）</span>
<span id="showActualBtn" onclick="showActualField()" style="font-size:14px;color:#0066cc;text-decoration:underline;cursor:pointer;font-weight:normal;">※多く入ったらこちらから入力</span>
</label>
<select id="base"></select>
</div>

<div class="box alert" id="actualBox">
<label style="display:flex;justify-content:space-between;align-items:center;"><span>実測主剤重量（kg）</span><span onclick="hideActualField()" style="font-size:14px;color:#0066cc;text-decoration:underline;cursor:pointer;font-weight:normal;">✕閉じる</span></label>
<div class="note">
実際に入った数値を入力
</div>
<select id="actual"></select>
</div>

<div class="box">
<label>希釈率（％）</label>
<select id="thinner"></select>
</div>

<button onclick="calc()">
▶ 配合計算
</button>

<div id="result" class="result"></div>

<script>

const ratio=document.getElementById("ratio");
const base=document.getElementById("base");
const actual=document.getElementById("actual");
const actualBox=document.getElementById("actualBox");
const showActualBtn=document.getElementById("showActualBtn");
const thinner=document.getElementById("thinner");
const result=document.getElementById("result");
const history=document.getElementById("history");


function add(select,text,value=text){
 let op=document.createElement("option");
 op.text=text;
 op.value=value;
 select.add(op);
}


add(ratio,"","");
add(ratio,"10:0（一液）","10:0");

for(let i=9;i>=1;i--){
 add(ratio,i+":"+(10-i));
}

add(base,"","");
for(let i=0.5;i<=20;i+=0.5){
 add(base,i.toFixed(1));
}

add(thinner,"","");
for(let i=0;i<=30;i++){
 add(thinner,i);
}


function updateActual(){
 actual.innerHTML="";
 add(actual,"","");

 if(base.value==="") return;

 let start=Number(base.value)+0.1;

 for(let i=start;i<=20.5;i+=0.1){
  add(
   actual,
   i.toFixed(1)+"kg",
   i.toFixed(1)
  );
 }
}


function showActualField(){
 actualBox.style.display = "block";
 if(showActualBtn) showActualBtn.style.display="none";
}



function hideActualField(){
 actual.value="";
 actualBox.style.display="none";
 if(showActualBtn) showActualBtn.style.display="inline";
}

function clearResult(){
 result.innerHTML="";
}


ratio.addEventListener("change",clearResult);

base.addEventListener("change",()=>{
 updateActual();
 clearResult();
});

actual.addEventListener("change",clearResult);

thinner.addEventListener("change",()=>{updateThinnerUI();clearResult();});



function updateThinnerUI(){
 let note=document.getElementById("thinNote");
 if(!note){note=document.createElement("div");note.id="thinNote";note.className="thin-note";document.getElementById("thinner").parentNode.appendChild(note);}
 const v=Number(thinner.value);thinner.style.color="black";note.textContent="";
 if(thinner.value==="") return;
 if(v<=13){}
 else if(v<=20){thinner.style.color="#cc7a00";note.style.color="#cc7a00";note.textContent="※メーカー推奨値を確認してください。";}
 else {thinner.style.color="red";note.style.color="red";note.textContent="⚠ 高希釈です。仕様をご確認ください。";}
}

function saveData(){
 let usedBase=(actualBox.style.display==="block" && actual.value!=="")?actual.value:base.value;
 let data={
  date:new Date().toLocaleString("ja-JP"),
  ratio:ratio.value,
  base:usedBase,
  thinner:thinner.value
 };

 localStorage.setItem(
  "paintData",
  JSON.stringify(data)
 );

 showHistory(data);
}


function loadData(){
 let data=localStorage.getItem("paintData");

 if(!data){
  updateActual();
  return;
 }

 data=JSON.parse(data);

 ratio.value=data.ratio;
 base.value=data.base;

 updateActual();

 thinner.value=data.thinner;
 updateThinnerUI();
 
 actual.value=""; // 起動時は常に空欄

 showHistory(data);
}


function showHistory(data){
 history.innerHTML=
 "前回使用：<br>"+
 data.date+"<br><br>"+
 "配合比："+data.ratio+"<br>"+
 "主剤重量："+data.base+"kg<br>"+
 "希釈率："+data.thinner+"％";
}


function calc(){

 if(
 ratio.value==="" ||
 base.value==="" ||
 thinner.value===""){
 
 alert("配合比・主剤重量・希釈率を選択してください");
 return;
 }

 // ボタンを押して実測値が選ばれている場合のみ実測値を使用
 let main = (actualBox.style.display === "block" && actual.value !== "")
 ? Number(actual.value)
 : Number(base.value);


 let r=ratio.value.split(":");

 let hard=
 main*Number(r[1])/Number(r[0]);

 let mix=main+hard;

 let thin=
 mix*Number(thinner.value)/100;

 let total=mix+thin;

if(hard===0){
  result.innerHTML='<div class="step">主剤（'+ratio.value+'）ここまで入れる<div class="value">'+main.toFixed(2)+'kg</div></div>'+'<div class="step">希釈剤（'+thinner.value+'％） '+thin.toFixed(2)+'kg 入れる<div class="value">'+total.toFixed(2)+'kg</div></div>';
}else{
 let hardText="硬化剤 "+hard.toFixed(2)+"kg 入れる";
 result.innerHTML='<div class="step">主剤（'+ratio.value+'）ここまで入れる<div class="value">'+main.toFixed(2)+'kg</div></div>'+'<div class="step">'+hardText+'<div class="value">'+mix.toFixed(2)+'kg</div></div>'+'<div class="step">希釈剤（'+thinner.value+'％） '+thin.toFixed(2)+'kg 入れる<div class="value">'+total.toFixed(2)+'kg</div></div>';
}

 saveData();
 
 // 実測欄をリセットして隠す
 actual.value="";
 actualBox.style.display = "none";
 if(showActualBtn) showActualBtn.style.display="inline";
}


updateThinnerUI();
loadData();

</script>

</body>
</html>
