<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>ARAGAU WEATHER - 雨雲レーダー比較</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #eef2f7; color: #111827; }
    header { position: sticky; top: 0; z-index: 10; padding: 12px 14px; background: rgba(15, 23, 42, .96); color: #fff; border-bottom: 1px solid rgba(255,255,255,.12); }
    header h1 { margin: 0; font-size: 18px; line-height: 1.3; }
    header p { margin: 4px 0 0; font-size: 12px; opacity: .82; }
    #locationStatus { margin-top: 7px; font-size: 12px; color: #dbeafe; }
    main { width: 100%; max-width: 900px; margin: 0 auto; padding: 10px; }
    section { margin: 0 0 14px; background: #fff; border: 1px solid #dbe3ec; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(15,23,42,.05); }
    .label { padding: 10px 12px; font-weight: 700; font-size: 15px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; }
    .note { display: block; margin-top: 2px; font-size: 11px; font-weight: 400; color: #64748b; }
    iframe { display: block; width: 100%; height: 520px; border: 0; background: #dbe3ec; }
    footer { padding: 8px 12px 20px; text-align: center; color: #64748b; font-size: 11px; }
    @media (max-width: 600px) { main { padding: 8px; } section { margin-bottom: 12px; border-radius: 10px; } iframe { height: 470px; } }
  </style>
</head>
<body>
  <header>
    <h1>ARAGAU WEATHER</h1>
    <p>雨雲レーダー比較 / Ver.0.3 / 2026-09-09</p>
    <div id="locationStatus">現在地を取得しています…</div>
  </header>

  <main>
    <section>
      <div class="label">1. Windy 雨雲レーダー<span class="note">公式Embed / 現在地に移動</span></div>
      <iframe id="windy" title="Windy 雨雲レーダー" loading="lazy" allow="geolocation" allowfullscreen></iframe>
    </section>

    <section>
      <div class="label">2. Ventusky 雨雲レーダー<span class="note">公式Embed / 現在地に移動</span></div>
      <iframe id="ventusky" title="Ventusky 雨雲レーダー" loading="lazy" allow="geolocation" allowfullscreen></iframe>
    </section>

    <section>
      <div class="label">3. ウェザーニュース<span class="note">雨雲レーダー / 表示確認済み</span></div>
      <iframe title="ウェザーニュース 雨雲レーダー" src="https://weathernews.jp/onebox/radar/" loading="lazy" allow="geolocation"></iframe>
    </section>

    <section>
      <div class="label">4. AccuWeather<span class="note">Japan Weather Radar / 表示確認済み</span></div>
      <iframe title="AccuWeather Japan Weather Radar" src="https://www.accuweather.com/en/jp/national/weather-radar" loading="lazy" allow="geolocation"></iframe>
    </section>

    <section>
      <div class="label">5. 雨雲ウィークリー<span class="note">1週間先の雨雲レーダー / 表示確認済み</span></div>
      <iframe title="雨雲ウィークリー" src="https://meteorological-curiosity.com/" loading="lazy" allow="geolocation"></iframe>
    </section>
  </main>

  <footer>各レーダーの表示内容・予測は各提供元によります。個人・家族向け比較用テストページ。</footer>

  <script>
    const status = document.getElementById("locationStatus");
    const defaultLat = 35.70;
    const defaultLon = 139.80;

    function setRadarLocations(lat, lon, label) {
      const windy = new URL("https://embed.windy.com/embed2.html");
      windy.search = new URLSearchParams({ lat, lon, detailLat: lat, detailLon: lon, width: 650, height: 520, zoom: 9, level: "surface", overlay: "radar", product: "radar", menu: "", message: "", marker: "", calendar: "now", pressure: "", type: "map", location: "coordinates", detail: "", metricWind: "default", metricTemp: "default", radarRange: "-1" });
      document.getElementById("windy").src = windy.href;
      document.getElementById("ventusky").src = `https://embed.ventusky.com/?p=${lat};${lon};9&l=radar`;
      status.textContent = `${label}（緯度 ${Number(lat).toFixed(4)} / 経度 ${Number(lon).toFixed(4)}）`;
    }

    setRadarLocations(defaultLat, defaultLon, "現在地取得前：初期位置");
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        position => setRadarLocations(position.coords.latitude, position.coords.longitude, "現在地を取得しました"),
        () => { status.textContent = "現在地を取得できないため、初期位置を表示しています"; },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
      );
    } else {
      status.textContent = "このブラウザは現在地取得に対応していないため、初期位置を表示しています";
    }
  </script>
</body>
</html>
