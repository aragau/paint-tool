<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>ARAGAU WEATHER - 雨雲レーダー比較</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef2f7;
      color: #111827;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.96);
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }
    header p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: .82;
    }
    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 10px;
    }
    section {
      margin: 0 0 14px;
      background: #fff;
      border: 1px solid #dbe3ec;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(15,23,42,.05);
    }
    .label {
      padding: 10px 12px;
      font-weight: 700;
      font-size: 15px;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
    }
    .note {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      font-weight: 400;
      color: #64748b;
    }
    iframe {
      display: block;
      width: 100%;
      height: 520px;
      border: 0;
      background: #dbe3ec;
    }
    footer {
      padding: 8px 12px 20px;
      text-align: center;
      color: #64748b;
      font-size: 11px;
    }
    @media (max-width: 600px) {
      main { padding: 8px; }
      section { margin-bottom: 12px; border-radius: 10px; }
      iframe { height: 470px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>ARAGAU WEATHER</h1>
    <p>雨雲レーダー比較 / Ver.0.1 Test / 2026-09-09</p>
  </header>

  <main>
    <section>
      <div class="label">1. Windy 雨雲レーダー<span class="note">公式Embed / 関東を初期表示</span></div>
      <iframe
        title="Windy 雨雲レーダー"
        src="https://embed.windy.com/embed2.html?lat=35.70&lon=139.80&detailLat=35.70&detailLon=139.80&width=650&height=520&zoom=7&level=surface&overlay=radar&product=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1"
        loading="lazy"
        allowfullscreen>
      </iframe>
    </section>

    <section>
      <div class="label">2. Ventusky 雨雲レーダー<span class="note">公式Embed / 関東を初期表示</span></div>
      <iframe
        title="Ventusky 雨雲レーダー"
        src="https://embed.ventusky.com/?p=35.70;139.80;7&l=radar"
        loading="lazy"
        allowfullscreen>
      </iframe>
    </section>

    <section>
      <div class="label">3. RainViewer 雨雲レーダー<span class="note">ライブレーダー埋め込み許可 / 関東を初期表示</span></div>
      <iframe
        title="RainViewer 雨雲レーダー"
        src="https://www.rainviewer.com/map.html?c=1&layer=radar&lm=0&loc=35.70%2C139.80%2C8&o=83&oAP=1&oC=0&oCS=1&oF=0&oFa=0&oU=0&rmt=2&sm=1&sn=1"
        loading="lazy"
        allowfullscreen>
      </iframe>
    </section>
  </main>

  <footer>
    各レーダーの表示内容・予測は各提供元によります。個人・家族向け比較用テストページ。
  </footer>
</body>
</html>
